<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>Meraki CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a08; --card:#16140f; --card2:#1f1c16; --line:#2e2a20;
  --gold:#d9b55c; --gold2:#f1d58a; --txt:#f5f1e8; --mut:#a8a297; --ok:#7cc48a; --warn:#e58a6b; --vino:#7a2348;
  --ig:#e1306c; --fb:#4a7fe0; --wa:#3fbf6a; --tt:#5fd3d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;font-size:16px}
body{padding-bottom:88px;min-height:100vh;background:radial-gradient(ellipse 90% 40% at 80% 0%,rgba(122,35,72,.22),transparent 70%),var(--bg)}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:600px;margin:0 auto;padding:14px 16px}
header{display:flex;align-items:center;gap:12px;padding:8px 0 10px}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font:italic 800 24px "Playfair Display",Georgia,serif;color:var(--gold2);flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;letter-spacing:.26em;color:var(--gold);font-size:14px;font-weight:800}
.brand small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
h2{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:24px 0 10px;font-weight:800}
h3{font-size:17px;margin:0 0 4px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}
.small{font-size:13px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.btn{background:var(--gold);color:#111;border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
.btn.dark{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--gold2);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 12px;font-size:16px;color-scheme:dark}
textarea{resize:vertical;min-height:96px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:18px 8px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,13,10,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:600px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--gold2)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#111;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.view{display:none}.view.on{display:block}
/* hoy */
.saludo{font:italic 800 26px "Playfair Display",Georgia,serif;margin:6px 0 2px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--gold2);font-weight:800}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600}
.tarea{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.tarea:last-child{border-bottom:0;padding-bottom:2px}
.tarea:first-child{padding-top:2px}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--card2);border:1px solid var(--line)}
.tarea .t{flex:1;min-width:0}
.tarea .n{font-weight:800}
.tarea .m{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.35}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prog{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .4s}
.idea{border-left:3px solid var(--gold);padding-left:12px}
/* gente */
.embudo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.embudo div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.embudo b{display:block;font-size:20px;color:var(--gold2)}
.embudo span{font-size:10.5px;color:var(--mut);font-weight:700}
.persona{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;background:var(--card2);border:1px solid var(--line);color:var(--gold2);position:relative}
.av i{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;font-size:10px;display:grid;place-items:center;font-style:normal;color:#111;font-weight:800;border:2px solid var(--card)}
.persona .t{flex:1;min-width:0}
.persona .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .m{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;background:var(--card2);border:1px solid var(--line);color:var(--gold2);white-space:nowrap}
.tag.nuevo{color:#111;background:var(--gold2);border-color:var(--gold2)}
.tag.cliente{color:var(--ok)}
.tag.perdido{color:var(--mut)}
/* contenido */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dia{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 2px;text-align:center;min-height:74px}
.dia.hoy{border-color:var(--gold)}
.dia.descanso{opacity:.45}
.dia small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase}
.dia b{display:block;font-size:17px;margin:2px 0 4px}
.dia i{display:block;width:8px;height:8px;border-radius:50%;margin:3px auto 0;background:var(--gold)}
.dia i.pub{background:var(--ok)}
.dia i.idea{background:transparent;border:1.5px solid var(--gold)}
.post{display:flex;gap:12px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:8px;align-items:center}
.post .f{width:58px;height:58px;border-radius:12px;background:var(--card2);flex:none;object-fit:cover;display:grid;place-items:center;font-size:22px;border:1px solid var(--line)}
.post .t{flex:1;min-width:0}
.post .n{font-weight:800;font-size:14.5px}
.post .m{font-size:12.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto{width:100%;aspect-ratio:1;border-radius:16px;background:var(--card2);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mut);font-weight:700;overflow:hidden;max-width:100%}
.foto img{width:100%;height:100%;object-fit:cover}
.redes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.red{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:800;color:var(--txt);font-size:14.5px}
.red span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
/* hojas */
.hoja{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none;padding-bottom:40px}
.hoja.on{display:block}
.hoja .top{position:sticky;top:0;background:rgba(11,10,8,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:2}
.hoja .top button.x{background:none;border:0;color:var(--txt);font-size:24px;padding:4px 8px}
.hoja .top b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{font-size:13.5px;border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-left:6px}
.hist small{color:var(--mut);display:block;font-size:11.5px}
.ia{background:linear-gradient(135deg,#2a1d2a,#1f1a10);border:1px solid #5a3d4a;border-radius:16px;padding:14px}
.ia .opc{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;white-space:pre-wrap;font-size:14.5px;line-height:1.45}
.cargando{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px}
@keyframes g{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--txt);color:#111;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:90;max-width:90%;text-align:center;display:none}
.paso{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.paso:last-child{border-bottom:0}
.paso b.n{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;flex:none;font-size:13px}
code{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px;color:var(--gold2);word-break:break-all}
.msg{padding:10px 12px;border-radius:14px;background:var(--card2);margin-top:6px;font-size:14.5px;line-height:1.4;max-width:85%}
.msg.yo{background:#3a2f17;margin-left:auto}
.msg small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.cdias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-top:10px}
.cdia{flex:none;width:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;text-align:center;color:var(--txt)}
.cdia .d{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase}
.cdia .n{font-size:20px;font-weight:800}
.cdia .c{font-size:11px;color:var(--gold2);font-weight:700;min-height:14px}
.cdia.on{background:var(--gold);border-color:var(--gold);color:#111}.cdia.on .d,.cdia.on .c{color:#111}
.cdia.cerr{opacity:.4}
.slot{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.slot:last-child{border-bottom:0}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hgrid .btn{padding:12px 8px;font-size:14px}
.hhoras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hhoras .chip{padding:9px 2px;font-size:13px;text-align:center}
.hoy-horario{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.hoy-horario .t{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.hoy-horario .t.esp{color:var(--gold2);font-weight:700}
.chip[disabled]{opacity:.35}
.slot .h{width:72px;flex:none;white-space:nowrap;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;padding-top:2px}
.slot .t{flex:1;min-width:0}
.slot.libre .h{color:var(--mut)}
.slot.pasado{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">M</div>
    <div class="brand"><b>MERAKI CRM</b><small id="subt">Clientes · Redes · Contenido</small></div>
    <button class="mini" id="btnSync" title="Actualizar">↻</button>
    <button class="mini" id="btnAj" title="Ajustes" style="padding:6px 8px;line-height:0"><span style="display:inline-block;width:20px;height:20px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span></button>
  </header>

  <!-- ============ HOY ============ -->
  <section class="view on" id="v-hoy">
    <div class="saludo" id="saludo">Hola, Jose</div>
    <div class="mut small" id="fecha"></div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b id="sHoy">0</b><span>para escribir hoy</span></div>
      <div class="stat"><b id="sNuevos">0</b><span>nuevos de redes</span></div>
      <div class="stat"><b id="sSemana">0/3</b><span>posts esta semana</span></div>
    </div>
    <h2>Caja de hoy</h2>
    <div class="card" id="hoyCaja"></div>
    <h2>Citas</h2>
    <div class="card" id="hoyCitas"></div>
    <h2>A quién escribirle hoy</h2>
    <div class="card" id="tareas"></div>
    <h2>Contenido</h2>
    <div class="card" id="hoyContenido"></div>
    <h2>Lo que te funciona</h2>
    <div class="card" id="hoyAnalisis"></div>
  </section>

  <!-- ============ GENTE ============ -->
  <section class="view" id="v-gente">
    <div class="row"><h2 style="margin:8px 0 0">Tu gente</h2><span class="sp"></span><button class="btn sm" id="btnNuevo">＋ Nuevo</button></div>
    <div class="embudo" id="embudo"></div>
    <input type="text" id="buscar" placeholder="Buscar nombre, usuario o teléfono" style="margin-top:12px">
    <div class="chips" id="filtros" style="margin-top:10px"></div>
    <div id="lista"></div>
  </section>

  <!-- ============ CONTENIDO ============ -->
  <section class="view" id="v-cont">
    <h2 style="margin:8px 0 0">Tu equipo de marketing</h2>
    <div id="equipo"></div>
    <div class="row"><h2 style="margin:18px 0 0">Esta semana</h2><span class="sp"></span><button class="btn sm" id="btnPost">＋ Publicación</button></div>
    <div class="row small mut" style="margin:6px 0 10px"><button class="mini" id="semAnt">‹</button><span id="semTxt" class="sp" style="text-align:center"></span><button class="mini" id="semSig">›</button></div>
    <div class="semana" id="semana"></div>
    <div id="posts"></div>
    <h2>Ideas para publicar</h2>
    <div class="chips" id="pilares"></div>
    <div id="ideas"></div>
  </section>

  <!-- ============ CITAS ============ -->
  <section class="view" id="v-citas"><div id="citas"></div></section>

  <!-- ============ BANDEJA (Meta) ============ -->
  <section class="view" id="v-bandeja"><div id="bandeja"></div></section>

  <!-- ============ AJUSTES ============ -->
  <section class="view" id="v-ajustes"><div id="ajustes"></div></section>
  <section class="view" id="v-caja"><div id="caja"></div></section>
</div>

<nav><div class="in">
  <button data-v="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoy<span class="dot" id="dotHoy"></span></button>
  <button data-v="gente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Gente</button>
  <button data-v="cont"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Contenido</button>
  <button data-v="citas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3v3H8z"/></svg>Citas<span class="dot" id="dotCit"></span></button>
  <button data-v="bandeja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Bandeja<span class="dot" id="dotBand"></span></button>
  <button data-v="caja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10.5h19"/><circle cx="16.5" cy="15" r="1.3"/><path d="M6 3.5h12"/></svg>Caja</button>
</div></nav>

<div class="hoja" id="hoja"><div class="top"><button class="x" id="hojaX">←</button><b id="hojaT"></b><span id="hojaA"></span></div><div class="wrap" id="hojaC"></div></div>
<div class="toast" id="toast"></div>

<script src="refs.js"></script>
<script>
"use strict";
/* ================================================================ base */
const $ = s => document.querySelector(s);
const APP = !!window.Android;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DIA = 86400000;
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const dias = t => t ? Math.floor((hoy0() - new Date(t).setHours(0,0,0,0)) / DIA) : null;
const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DIAS_L = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaLarga = t => { const d = new Date(t); return DIAS_L[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const hora = t => { const d = new Date(t); let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + (m ? ":" + String(m).padStart(2,"0") : "") + " " + ap; };
const haceTxt = t => { const n = dias(t); return n === null ? "" : n <= 0 ? "hoy" : n === 1 ? "ayer" : "hace " + n + " días"; };
function toast(t){ const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.k); toast.k = setTimeout(() => e.style.display = "none", 2600); }

const fotos = (() => {
  let db;
  const abrir = () => db ? Promise.resolve(db) : new Promise((ok, mal) => { const r = indexedDB.open("crm_fotos", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => ok(db = r.result); r.onerror = () => mal(r.error); });
  const tx = (m, fn) => abrir().then(d => new Promise((ok, mal) => { const t = d.transaction("f", m); const r = fn(t.objectStore("f")); t.oncomplete = () => ok(r && r.result); t.onerror = () => mal(t.error); }));
  return { poner:(k, v) => tx("readwrite", s => s.put(v, k)), leer:k => tx("readonly", s => s.get(k)).catch(() => null), quitar:k => tx("readwrite", s => s.delete(k)) };
})();

function http(metodo, url, {headers = {}, body = "", tipo = "json"} = {}) {
  if (APP) return new Promise(ok => { const id = uid(); esperando[id] = ok; Android.http(id, metodo, url, JSON.stringify(headers), typeof body === "string" ? body : JSON.stringify(body), tipo); })
    .then(r => { let j = null; try { j = JSON.parse(r.texto); } catch(e) {} return {estado:r.estado, json:j, texto:r.texto}; });
  const op = {method:metodo, headers:Object.assign({}, headers)};
  if (tipo === "multipart") { const f = new FormData(); const o = JSON.parse(body); for (const k in o) f.append(k, o[k]); op.body = f; }
  else if (body) { op.body = typeof body === "string" ? body : JSON.stringify(body); op.headers["Content-Type"] = op.headers["Content-Type"] || (tipo === "form" ? "application/x-www-form-urlencoded" : "application/json"); }
  return fetch(url, op).then(async r => { const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch(e) {} return {estado:r.status, json:j, texto:t}; }).catch(e => ({estado:0, json:{error:{message:String(e)}}, texto:""}));
}

function valor(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("timestampValue" in v) return v.timestampValue;
  if ("nullValue" in v) return null;
  if ("mapValue" in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = valor(f[k]); return o; }
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valor);
  return null;
}
const docA = d => { const o = {}; const f = d.fields || {}; for (const k in f) o[k] = valor(f[k]); o.id = d.name.split("/").pop(); return o; };
async function listar(col, t) {
  let todos = [], pag = "";
  for (let i = 0; i < 20; i++) {
    const r = await http("GET", FS + "/" + col + "?pageSize=300" + (pag ? "&pageToken=" + encodeURIComponent(pag) : ""), {headers:{Authorization:"Bearer " + t}});
    if (r.estado !== 200) return {error:r};
    todos = todos.concat((r.json.documents || []).map(docA));
    if (!r.json.nextPageToken) break; pag = r.json.nextPageToken;
  }
  return {docs:todos};
}

async function subirDoc(id, obj) {
  if (!D.aj.rt || D.aj.crmNube === false) return;

  const r = await http("PATCH", FS + "/crm/" + id, {headers:{Authorization:"Bearer " + t}, body:{fields:{d:{stringValue:JSON.stringify(obj)}, u:{integerValue:String(obj.u || Date.now())}}}});

async function bajarCrm(t) {
  const r = await listar("crm", t);
  if (!r.docs) { if (r.error && r.error.estado === 403) D.aj.crmNube = false; return; }
  D.aj.crmNube = true;
  for (const doc of r.docs) {
    let o; try { o = JSON.parse(doc.d); } catch(e) { continue; }
    const lista = doc.id.startsWith("p_") ? D.personas : doc.id.startsWith("x_") ? D.posts : doc.id.startsWith("v_") ? D.ventas : doc.id.startsWith("g_") ? D.gastos : doc.id.startsWith("f_") ? D.fiados : doc.id.startsWith("z_") ? D.cierres : doc.id.startsWith("i_") ? D.inv : null; if (!lista) continue;

  }
}

const inicioSemana = (t = Date.now()) => { const d = new Date(t); d.setHours(0,0,0,0); const w = (d.getDay() + 6) % 7; return d.getTime() - w * DIA; };
const postsEntre = (a, b) => D.posts.filter(p => !p.borrado && p.fecha && new Date(p.fecha).getTime() >= a && new Date(p.fecha).getTime() < b);
const publicadosSemana = (t = Date.now()) => postsEntre(inicioSemana(t), inicioSemana(t) + 7 * DIA).filter(p => p.estado === "publicado").length;
function racha() { let n = 0, s = inicioSemana() - 7 * DIA; if (publicadosSemana() >= D.aj.meta) n = 1; while (publicadosSemana(s) >= D.aj.meta && n < 99) { n++; s -= 7 * DIA; } return n; }
const puntos = p => p.res ? (Number(p.res.likes) || 0) + 3 * (Number(p.res.comentarios) || 0) + 4 * (Number(p.res.guardados) || 0) + 2 * (Number(p.res.compartidos) || 0) : null;
function analisis() {
  const con = D.posts.filter(p => !p.borrado && p.estado === "publicado" && puntos(p) !== null);
  if (con.length < 4) return null;
  const prom = a => a.reduce((s, x) => s + puntos(x), 0) / a.length, gen = prom(con);
  const por = f => { const g = {}; con.forEach(p => { const k = f(p); (g[k] = g[k] || []).push(p); }); return Object.entries(g).filter(([, a]) => a.length >= 2).map(([k, a]) => ({k, v:prom(a), n:a.length})).sort((a, b) => b.v - a.v); };
  const franja = h => h < 11 ? "mañana (antes de 11)" : h < 14 ? "mediodía (11 a 2)" : h < 18 ? "tarde (2 a 6)" : "noche (después de 6)";
  return {n:con.length, gen, pilar:por(p => p.pilar || "otro")[0], dia:por(p => new Date(p.fecha).getDay())[0], franja:por(p => franja(new Date(p.fecha).getHours()))[0], top:con.slice().sort((a, b) => puntos(b) - puntos(a))[0]};
}
function pilarSugerido() {
  const ult = {}; Object.keys(PILARES).forEach(k => ult[k] = 0);
  D.posts.filter(p => !p.borrado && p.pilar && p.estado !== "idea").forEach(p => ult[p.pilar] = Math.max(ult[p.pilar] || 0, new Date(p.fecha || p.u || 0).getTime()));
  const a = analisis(); let lista = Object.keys(PILARES).sort((x, y) => ult[x] - ult[y]);
  if (a && a.pilar && PILARES[a.pilar.k] && dias(ult[a.pilar.k]) >= 5) lista = [a.pilar.k].concat(lista.filter(x => x !== a.pilar.k));
  return lista[0];
}

async function publicarMeta(post, donde, textoFinal, foto) {
  const hechos = [];

    const p = await graph(D.meta.ig + "/media_publish", {creation_id:c.id}, "POST");

/* ================================================================ Avisos para Leo (promos, cierres) */
// Se guardan en el servidor de Leo. La clave la pone la parte nativa de la app (nunca pasa por aquí).
let leoAvisos = null, leoHoy = "", leoCuando = 0;
const LEO_APP = () => APP && typeof Android.leo === "function";
const fechaAviso = f => { const d = new Date(f + "T12:00:00-06:00"); return ["dom","lun","mar","mié","jue","vie","sáb"][d.getUTCDay()] + " " + d.getUTCDate() + " " + ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getUTCMonth()]; };
function leoPedir(metodo, cuerpo) {
  return new Promise(ok => { const id = uid(); esperando[id] = ok; Android.leo(id, metodo, cuerpo ? JSON.stringify(cuerpo) : ""); })
    .then(r => { let j = null; try { j = JSON.parse(r.texto); } catch(e) {} return {estado:r.estado, json:j, texto:r.texto}; });
}
async function leoCargar() {
  if (!LEO_APP()) return;
  leoCuando = Date.now();
  const r = await leoPedir("GET");
  if (r.estado === 200 && r.json && Array.isArray(r.json.avisos)) { leoAvisos = r.json.avisos; leoHoy = r.json.hoy || ymdSV(Date.now()); }
  else leoAvisos = {error: r.estado === 403 ? "La clave de Leo no coincide. Abrí otra vez tu enlace para activar los avisos de Leo." : r.estado === 0 ? "Sin conexión. Revisá el internet." : errorDe(r)};
  leoPintar();
}
function leoPintar() {
  const L = $("#leoLista"); if (!L) return;
  if (!leoAvisos) { L.innerHTML = '<div class="small mut" style="margin-top:10px"><span class="cargando"></span> Cargando…</div>'; return; }
  if (leoAvisos.error) { L.innerHTML = '<div class="small warn" style="margin-top:10px;line-height:1.4">' + esc(leoAvisos.error) + '</div><button class="mini" style="margin-top:8px" id="leoReint">Intentar otra vez</button>'; return; }
  if (!leoAvisos.length) { L.innerHTML = '<div class="small mut" style="margin-top:10px">Todavía no hay avisos.</div>'; return; }

async function consulta(col, desdeISO, t) {
  const r = await http("POST", FS + ":runQuery", {headers:{Authorization:"Bearer " + t}, body:{structuredQuery:{from:[{collectionId:col}],
    where:{fieldFilter:{field:{fieldPath:"cuando"}, op:"GREATER_THAN_OR_EQUAL", value:{timestampValue:desdeISO}}}, orderBy:[{field:{fieldPath:"cuando"}}]}}});
  if (r.estado !== 200 || !Array.isArray(r.json)) return {error:r};
  return {docs:r.json.filter(x => x.document).map(x => docA(x.document))};
}
async function traerCitas() {

  if (c.error) { D.citas.error = c.error.estado === 403 ? "regla" : errorDe(c.error); guardar(); return; }
  D.citas.error = "";

  const conCita = new Set(D.citas.lista.map(x => x.id));

  D.citas.etiq = {};   // bloqueos que puso un aviso de horario especial: id de la hora → id del aviso
  (o.docs || []).forEach(x => { if (x.h && !conCita.has(x.id)) D.citas.etiq[x.id] = String(x.h); });
  if (D.citas.vistas === null) D.citas.vistas = [...conCita];      // la primera vez no avisamos de las viejas

  if (APP) alarmas();

async function escribirFS(writes) {

/* ================================================================ HORARIO ESPECIAL */
// Cerrado un día, abro más tarde, cierro más temprano o cerrado varios días. El aviso se guarda en el servidor de Leo

const minC = t => { const m = /^(\d{2}):(\d{2})$/.exec(String(t || "")); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; };

const fechaH = f => { const h = ymdSV(Date.now()); return f === h ? "hoy " + fechaP(f) : f === sumarF(h, 1) ? "mañana " + fechaP(f) : fechaP(f); };
const mayus = t => t.charAt(0).toUpperCase() + t.slice(1);
const vigentes = () => { const h = ymdSV(Date.now()); return (D.horario.dias || []).filter(e => e && e.hasta >= h); };
function horarioDia(f, lista) {
  const r = {cerrado:dowF(f) === 1, abre:ABRE_C, cierra:CIERRA_C, especial:false};
  for (const e of lista || []) {
    if (f < e.desde || f > e.hasta) continue;
    r.especial = true;
    if (e.tipo === "cerrado") r.cerrado = true;
    else if (e.tipo === "tarde") r.abre = Math.max(r.abre, minC(e.hora));
    else if (e.tipo === "temprano") r.cierra = Math.min(r.cierra, minC(e.hora));

  for (let f = e.desde, i = 0; f <= e.hasta && i < 62; f = sumarF(f, 1), i++) {

async function commitFS(writes) {   // como escribirFS, sin mensajes, para poder reintentar

async function bloquearAviso(e) {

    const W = horasDe(e).filter(id => !conCita.has(id) && !bloq.has(id)).map(id => crear("ocupado", id, {cuando:instanteC(id.slice(0, 10), Number(id.slice(11))), b:true, h:e.id}));

// Libera las horas que bloqueó un aviso. Si otro aviso vigente también cierra esa hora, se queda bloqueada a nombre de ese.

  const W = [];
  Object.keys(D.citas.etiq || {}).forEach(id => {

function resumenCaja() {
  const h0 = hoy0(), sem = inicioSemana(), semAnt = sem - 7 * DIA, mes = inicioMes(), mesAnt = inicioMes(mes - DIA);
  const hoyT = sumaEntre(h0, h0 + DIA), semT = sumaEntre(sem, sem + 7 * DIA), semAntT = sumaEntre(semAnt, sem), mesT = sumaEntre(mes, Date.now() + DIA), mesAntT = sumaEntre(mesAnt, mes);
  const diasTrab = new Set(vivas().filter(v => v.t >= mes).map(v => ymdSV(v.t))).size;
  const card = (n, v, sub) => '<div class="stat"><b style="font-size:20px">' + plata(v) + '</b><span>' + n + (sub ? '<br>' + sub : '') + '</span></div>';
  const comp = (a, b) => b > 0 ? (a >= b ? '<span class="ok">▲ ' + Math.round((a - b) / b * 100) + '%</span>' : '<span class="warn">▼ ' + Math.round((b - a) / b * 100) + '%</span>') : "";
  let x = '<div class="stats">' + card("Hoy", hoyT) + card("Esta semana", semT, comp(semT, semAntT)) + card("Este mes", mesT, comp(mesT, mesAntT)) + '</div>';
  x += '<div class="row small" style="margin-top:14px"><span class="mut">Meta del mes</span><span class="sp"></span><b>' + plata(mesT) + ' de ' + plata(D.aj.metaMes) + '</b></div><div class="prog"><i style="width:' + Math.min(100, mesT / D.aj.metaMes * 100) + '%"></i></div>';
  if (diasTrab) { const prom = mesT / diasTrab, falta = Math.max(0, D.aj.metaMes - mesT); x += '<div class="small mut" style="margin-top:8px;line-height:1.5">Promedio: <b style="color:var(--txt)">' + plata(prom) + '</b> por día trabajado (' + diasTrab + ' días).' + (falta ? ' Te faltan <b style="color:var(--txt)">' + plata(falta) + '</b> para la meta.' : ' <b class="ok">¡Meta cumplida!</b>') + '</div>'; }
  // últimos 7 días
  const D7 = []; for (let i = 6; i >= 0; i--) { const a = h0 - i * DIA; D7.push({d:new Date(a), v:sumaEntre(a, a + DIA)}); }
  const mx = Math.max(1, ...D7.map(d => d.v));

  // por servicio y por pago (este mes)
  const porS = {}, porP = {}; vivas().filter(v => v.t >= mes).forEach(v => { (v.items || []).forEach(i => { const k = i.n; porS[k] = porS[k] || {n:0, m:0}; porS[k].n++; porS[k].m += v.pago === "regalo" ? 0 : i.m; }); porP[v.pago] = (porP[v.pago] || 0) + (Number(v.total) || 0); });

  // regalos vendidos este mes
  const rgMes = regalosDe().filter(r => r.creado && new Date(r.creado).getTime() >= mes);

  // cobros de hoy
  const hoyV = vivas().filter(v => v.t >= h0).sort((a, b) => b.t - a.t);
  x += '<h2>Cobros de hoy</h2>' + (hoyV.length ? hoyV.map(v => '<div class="slot"><div class="h">' + hora(v.t) + '</div><div class="t"><b>' + plata(v.total) + '</b> <span class="mut small">· ' + (PAGO_N[v.pago] || v.pago) + '</span><div class="mut small">' + esc((v.items || []).map(i => i.n).join(", ")) + (v.nombre ? " · " + esc(v.nombre) : "") + '</div></div><button class="mini" data-del="' + v.id + '">Borrar</button></div>').join("") : '<div class="empty">Todavía no cobrás nada hoy.</div>');

  };

  const act = R.filter(r => estadoRg(r) === "activa"), us = R.filter(r => estadoRg(r) === "usada"), ven = R.filter(r => estadoRg(r) === "vencida");
  const mes = inicioMes(), vMes = R.filter(r => r.creado && new Date(r.creado).getTime() >= mes);
  x += '<div class="stats"><div class="stat"><b>' + act.length + '</b><span>por usar</span></div><div class="stat"><b>' + us.length + '</b><span>ya usadas</span></div><div class="stat"><b>' + plata(vMes.reduce((s, r) => s + r.precio, 0)) + '</b><span>vendido este mes</span></div></div>';
  const fila = r => { const e = estadoRg(r), dv = r.vence ? diasPara(r.vence) : null; return '<div class="slot"><div class="h" style="font-family:monospace;font-size:12px">' + esc(r.id.slice(0, 4) + "-" + r.id.slice(4)) + '</div><div class="t"><b>' + esc(r.para || "—") + '</b> <span class="mut small">de ' + esc(r.de || "—") + '</span><div class="mut small">' + esc(r.servicio) + ' · ' + plata(r.precio) + (e === "activa" && dv !== null ? ' · ' + (dv <= 14 ? '<b class="warn">vence en ' + dv + (dv === 1 ? " día" : " días") + '</b>' : 'vence el ' + fechaLarga(new Date(r.vence + "T12:00:00"))) : e === "usada" ? ' · usada ' + haceTxt(r.usada) : ' · venció') + '</div></div></div>'; };
  x += '<h2>Por usar</h2>' + (act.length ? act.sort((a, b) => String(a.vence).localeCompare(String(b.vence))).map(fila).join("") : '<div class="empty">No hay tarjetas pendientes.</div>');
  if (us.length) x += '<h2>Usadas</h2>' + us.slice(0, 20).map(fila).join("");
  if (ven.length) x += '<h2>Vencidas</h2>' + ven.slice(0, 20).map(fila).join("");
  x += '<div class="small mut" style="margin-top:16px;line-height:1.5">Las tarjetas se crean y se marcan como usadas en la app de la Tarjeta Meraki (pestaña Regalos). Aquí solo las ves. Cuando alguien venga con la suya, cobrale con «Tarjeta de regalo» para que no se sume dos veces a la caja.</div>';
  x += '<button class="btn dark full" style="margin-top:14px" id="rgSync">↻ Actualizar</button>';
  const C = hoja("Tarjetas de regalo", x);
  hoja.re = verRegalos;
  C.onclick = async e => { const b = e.target.closest("button"); if (b && b.id === "rgSync") { b.innerHTML = '<span class="cargando"></span>'; await traerTarjeta(true); verRegalos(); } };
}

/* ================================================================ CAJA (pestaña): como Treinta, pero nuestro */
const CAT_G = [["renta","🏠","Renta"],["bebidas","🥤","Bebidas y productos"],["insumos","✂️","Insumos de barbería"],["servicios","💡","Luz, agua, internet"],["apps","📱","Apps y publicidad"],["tarjeta","💳","Pago de tarjeta"],["otro","📦","Otro"]];
const catG = k => CAT_G.find(c => c[0] === k) || CAT_G[CAT_G.length - 1];
let cjTab = "balance", cjPer = "hoy";
const gVivos = () => D.gastos.filter(g => !g.borrado);
const rango = p => { const h = hoy0(); return p === "hoy" ? [h, h + DIA] : p === "semana" ? [inicioSemana(), inicioSemana() + 7 * DIA] : [inicioMes(), Date.now() + DIA]; };
const gastoEntre = (a, b) => gVivos().filter(g => g.t >= a && g.t < b).reduce((s, g) => s + (Number(g.monto) || 0), 0);
const saldoF = f => Math.round(((Number(f.monto) || 0) - (f.abonos || []).reduce((s, a) => s + (Number(a.m) || 0), 0)) * 100) / 100;
const fPend = () => D.fiados.filter(f => !f.borrado && saldoF(f) > 0.001);
const invBajo = () => D.inv.filter(x => !x.borrado && (Number(x.stock) || 0) <= (Number(x.min) || 0));

function pintarCajaTab() {
  const el = $("#caja"); const [a, b] = rango(cjPer);
  const ing = sumaEntre(a, b), gas = gastoEntre(a, b), gan = ing - gas;
  const debe = fPend().reduce((s, f) => s + saldoF(f), 0), bajo = invBajo().length;
  let x = '<div class="row" style="margin-top:8px"><h2 style="margin:0">Caja</h2><span class="sp"></span><button class="mini" id="cjGraf">📊 Gráficas</button></div>';
  x += '<div class="chips" style="margin-top:10px" id="cjPer">' + [["hoy","Hoy"],["semana","Esta semana"],["mes","Este mes"]].map(([k, n]) => '<button class="chip' + (cjPer === k ? " on" : "") + '" data-per="' + k + '">' + n + '</button>').join("") + '</div>';
  x += '<div class="card" style="margin-top:12px"><div class="row"><div><div class="mut small">Ganancia</div><div style="font-size:32px;font-weight:800;color:' + (gan >= 0 ? "var(--gold2)" : "var(--warn)") + '">' + (gan < 0 ? "-" : "") + plata(Math.abs(gan)) + '</div></div></div>' +
    '<div class="row small" style="margin-top:10px;gap:14px"><span>Ventas <b class="ok">' + plata(ing) + '</b></span><span>Gastos <b class="warn">' + plata(gas) + '</b></span></div>' +
    '<div class="row" style="gap:10px;margin-top:14px"><button class="btn" style="flex:1" id="cjV">＋ Venta</button><button class="btn dark" style="flex:1;color:var(--warn)" id="cjG">－ Gasto</button></div></div>';
  x += '<div class="chips" style="margin-top:14px" id="cjTabs">' + [["balance","Movimientos"],["fiados","Fiados" + (fPend().length ? " (" + fPend().length + ")" : "")],["inv","Inventario" + (bajo ? " ⚠️" : "")],["cierre","Cierre"]].map(([k, n]) => '<button class="chip' + (cjTab === k ? " on" : "") + '" data-tab="' + k + '">' + n + '</button>').join("") + '</div><div id="cjC" style="margin-top:12px"></div>';
  el.innerHTML = x;
  ({balance:cjMovs, fiados:cjFiados, inv:cjInv, cierre:cjCierre})[cjTab](a, b, debe);
  el.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.per) { cjPer = t.dataset.per; pintarCajaTab(); }
    else if (t.dataset.tab) { cjTab = t.dataset.tab; pintarCajaTab(); }
    else if (t.id === "cjV") cobrar();
    else if (t.id === "cjG") nuevoGasto();
    else if (t.id === "cjGraf") resumenCaja();
    else if (cjAcciones[t.dataset.ac]) cjAcciones[t.dataset.ac](t);
  };
}

function cjMovs(a, b) {
  const M = vivas().filter(v => v.t >= a && v.t < b).map(v => ({t:v.t, tipo:"v", o:v})).concat(gVivos().filter(g => g.t >= a && g.t < b).map(g => ({t:g.t, tipo:"g", o:g}))).sort((x, y) => y.t - x.t);
  const fecha = t => cjPer === "hoy" ? hora(t) : new Date(t).getDate() + "/" + (new Date(t).getMonth() + 1);
  $("#cjC").innerHTML = '<div class="card">' + (M.length ? M.map(m => m.tipo === "v"
    ? '<div class="slot"><div class="h">' + fecha(m.t) + '</div><div class="t"><b class="' + (m.o.pago === "fiado" || m.o.pago === "regalo" ? "mut" : "ok") + '">+' + plata(m.o.total) + '</b> <span class="mut small">· ' + (PAGO_N[m.o.pago] || m.o.pago) + '</span><div class="mut small">' + esc((m.o.items || []).map(i => i.n).join(", ")) + (m.o.nombre ? " · " + esc(m.o.nombre) : "") + '</div></div><button class="mini" data-ac="borrarV" data-id="' + m.o.id + '">✕</button></div>'
    : '<div class="slot"><div class="h">' + fecha(m.t) + '</div><div class="t"><b class="warn">−' + plata(m.o.monto) + '</b> <span class="mut small">· ' + catG(m.o.cat)[1] + ' ' + catG(m.o.cat)[2] + '</span><div class="mut small">' + esc(m.o.desc || "") + '</div></div><button class="mini" data-ac="borrarG" data-id="' + m.o.id + '">✕</button></div>').join("")
    : '<div class="empty">Sin movimientos ' + (cjPer === "hoy" ? "hoy" : cjPer === "semana" ? "esta semana" : "este mes") + '. Tocá «＋ Venta» o «－ Gasto».</div>') + '</div>';
  // gastos por categoría
  const porC = {}; gVivos().filter(g => g.t >= a && g.t < b).forEach(g => porC[g.cat] = (porC[g.cat] || 0) + (Number(g.monto) || 0));
  if (Object.keys(porC).length) $("#cjC").innerHTML += '<h2>En qué se va la plata</h2><div class="card">' + Object.entries(porC).sort((x, y) => y[1] - x[1]).map(([k, m]) => '<div class="row small" style="padding:5px 0"><span>' + catG(k)[1] + ' ' + catG(k)[2] + '</span><span class="sp"></span><b>' + plata(m) + '</b></div>').join("") + '</div>';
}

function nuevoGasto(g0) {
  let cat = g0 ? g0.cat : "insumos", pago = g0 ? g0.pago || "efectivo" : "efectivo";
  const C = hoja("Nuevo gasto", '<label class="l">¿En qué?</label><div class="chips" id="ngC" style="flex-wrap:wrap">' + CAT_G.map(c => '<button class="chip' + (c[0] === cat ? " on" : "") + '" data-c="' + c[0] + '">' + c[1] + ' ' + c[2] + '</button>').join("") + '</div>' +
    '<label class="l">¿Cuánto?</label><input type="number" id="ngM" inputmode="decimal" step="0.05" min="0" placeholder="$0.00" value="' + (g0 ? g0.monto : "") + '">' +
    '<label class="l">Detalle (opcional)</label><input type="text" id="ngD" placeholder="Ej.: 2 fardos de gaseosa, cuchillas" value="' + esc(g0 ? g0.desc || "" : "") + '">' +
    '<label class="l">¿Con qué pagaste?</label><div class="chips" id="ngP">' + ["efectivo","tarjeta","transferencia"].map(k => '<button class="chip' + (k === pago ? " on" : "") + '" data-p="' + k + '">' + PAGO_N[k] + '</button>').join("") + '</div>' +
    '<div class="small mut" style="margin-top:8px">Si compraste bebidas, después sumalas en <b>Inventario → Recibí producto</b>.</div>' +
    '<button class="btn full" style="margin-top:16px" id="ngOk">Guardar gasto</button>');
  C.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.c) { cat = b.dataset.c; C.querySelectorAll("#ngC .chip").forEach(x => x.classList.toggle("on", x === b)); }
    if (b.dataset.p) { pago = b.dataset.p; C.querySelectorAll("#ngP .chip").forEach(x => x.classList.toggle("on", x === b)); }
    if (b.id === "ngOk") {
      const m = parseFloat($("#ngM").value); if (!(m > 0)) { toast("Poné cuánto gastaste"); return; }
      const g = {id:uid(), t:Date.now(), cat, monto:Math.round(m * 100) / 100, desc:$("#ngD").value.trim(), pago, u:Date.now()};
      D.gastos.push(g); guardar(); subirDoc("g_" + g.id, g); toast("Gasto de " + plata(g.monto) + " guardado"); cerrarHoja();
    }
  };
}

function cjFiados(a, b, debe) {
  const P = fPend().sort((x, y) => x.t - y.t), pag = D.fiados.filter(f => !f.borrado && saldoF(f) <= 0.001).sort((x, y) => (y.pagado || 0) - (x.pagado || 0)).slice(0, 10);
  let x = '<div class="card"><div class="row"><div><div class="mut small">Te deben</div><div style="font-size:26px;font-weight:800;color:var(--gold2)">' + plata(debe) + '</div></div><span class="sp"></span><button class="btn sm" data-ac="nuevoF">＋ Fiado</button></div></div>';
  x += '<div class="card" style="margin-top:12px">' + (P.length ? P.map(f => '<div class="slot"><div class="h" style="font-size:12px">' + haceTxt(f.t) + '</div><div class="t"><b>' + esc(f.nombre) + '</b> <span class="warn small">debe ' + plata(saldoF(f)) + '</span><div class="mut small">' + esc(f.desc || "") + ((f.abonos || []).length ? ' · abonó ' + plata(f.monto - saldoF(f)) : '') + '</div><div class="acts"><button class="btn sm" data-ac="abonar" data-id="' + f.id + '">Me pagó</button><button class="mini" data-ac="cobrarF" data-id="' + f.id + '">Recordarle</button></div></div></div>').join("") : '<div class="empty">Nadie te debe. 👌</div>') + '</div>';
  if (pag.length) x += '<h2>Ya pagaron</h2><div class="card">' + pag.map(f => '<div class="row small" style="padding:5px 0"><span>' + esc(f.nombre) + '</span><span class="sp"></span><span class="ok">' + plata(f.monto) + ' ✓</span></div>').join("") + '</div>';
  $("#cjC").innerHTML = x;
}

function cjInv() {
  const L = D.inv.filter(x => !x.borrado);
  let x = '<div class="card">' + L.map(i => { const st = Number(i.stock) || 0, bajo = st <= (Number(i.min) || 0); return '<div class="slot"><div class="t"><b>' + esc(i.n) + '</b> <span class="mut small">· ' + plata(i.p) + '</span><div class="small ' + (bajo ? "warn" : "mut") + '">' + (st <= 0 ? "Se acabó" : "Quedan " + st) + (bajo && st > 0 ? " · ¡comprá más!" : "") + '</div></div><div class="row" style="gap:6px"><button class="mini" data-ac="invMenos" data-id="' + i.id + '">−</button><b style="min-width:26px;text-align:center">' + st + '</b><button class="mini" data-ac="invMas" data-id="' + i.id + '">＋</button></div></div>'; }).join("") + '</div>';
  x += '<div class="row" style="gap:10px;margin-top:12px"><button class="btn" style="flex:1" data-ac="recibi">📦 Recibí producto</button><button class="btn dark" style="flex:1" data-ac="nuevoProd">＋ Producto nuevo</button></div>';
  x += '<div class="small mut" style="margin-top:10px;line-height:1.5">Cada vez que cobrás una bebida en «＋ Venta», se descuenta sola. Te aviso cuando quedan pocas.</div>';
  $("#cjC").innerHTML = x;
}

function cjCierre() {
  const h0 = hoy0(), hoyV = vivas().filter(v => v.t >= h0);
  const efV = hoyV.filter(v => v.pago === "efectivo").reduce((s, v) => s + (Number(v.total) || 0), 0);
  const efG = gVivos().filter(g => g.t >= h0 && g.pago === "efectivo").reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const hoyStr = ymdSV(Date.now()), ya = D.cierres.find(c => c.fecha === hoyStr && !c.borrado);
  const fondo = ya ? ya.fondo : (D.aj.fondo || 0);
  let x = '<div class="card"><div class="mut small" style="line-height:1.5">Al final del día contá el efectivo de la gaveta y te digo si cuadra.</div>' +
    '<label class="l">Con cuánto abriste (fondo / sencillo)</label><input type="number" id="ciF" inputmode="decimal" step="0.05" value="' + fondo + '">' +
    '<div class="row small" style="margin-top:12px"><span>＋ Ventas en efectivo</span><span class="sp"></span><b class="ok">' + plata(efV) + '</b></div>' +
    '<div class="row small" style="margin-top:4px"><span>− Gastos en efectivo</span><span class="sp"></span><b class="warn">' + plata(efG) + '</b></div>' +
    '<div class="row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><b>Debería haber</b><span class="sp"></span><b id="ciE" style="font-size:20px;color:var(--gold2)"></b></div>' +
    '<label class="l">¿Cuánto contaste?</label><input type="number" id="ciC" inputmode="decimal" step="0.05" placeholder="$0.00" value="' + (ya ? ya.contado : "") + '">' +
    '<div id="ciR" style="margin-top:10px"></div><button class="btn full" style="margin-top:12px" data-ac="cerrar">' + (ya ? "Actualizar cierre" : "Cerrar caja de hoy") + '</button></div>';
  const H = D.cierres.filter(c => !c.borrado).sort((p, q) => q.fecha.localeCompare(p.fecha)).slice(0, 10);
  if (H.length) x += '<h2>Cierres anteriores</h2><div class="card">' + H.map(c => '<div class="row small" style="padding:5px 0"><span>' + fechaLarga(new Date(c.fecha + "T12:00:00")) + '</span><span class="sp"></span><span>' + plata(c.contado) + '</span><b style="margin-left:10px" class="' + (Math.abs(c.dif) < 0.01 ? "ok" : "warn") + '">' + (Math.abs(c.dif) < 0.01 ? "✓ cuadró" : (c.dif > 0 ? "+" : "−") + plata(Math.abs(c.dif))) + '</b></div>').join("") + '</div>';
  $("#cjC").innerHTML = x;
  const calc = () => { const f = parseFloat($("#ciF").value) || 0, esp = f + efV - efG, c = parseFloat($("#ciC").value); $("#ciE").textContent = plata(esp); if (isNaN(c)) { $("#ciR").innerHTML = ""; return; } const d = Math.round((c - esp) * 100) / 100; $("#ciR").innerHTML = Math.abs(d) < 0.01 ? '<b class="ok">✓ Cuadra exacto</b>' : d > 0 ? '<b class="warn">Sobran ' + plata(d) + '</b> <span class="mut small">¿un cobro sin anotar?</span>' : '<b class="warn">Faltan ' + plata(-d) + '</b> <span class="mut small">¿un gasto o vuelto sin anotar?</span>'; return {f, esp, c, d}; };
  calc(); $("#ciF").oninput = calc; $("#ciC").oninput = calc;
  cjAcciones._cierre = () => { const r = calc(); if (!r || isNaN(r.c)) { toast("Escribí cuánto contaste"); return; } const z = ya || {id:uid(), fecha:hoyStr}; Object.assign(z, {fondo:r.f, esperado:r.esp, contado:r.c, dif:r.d, u:Date.now()}); if (!ya) D.cierres.push(z); D.aj.fondo = r.f; guardar(); subirDoc("z_" + z.id, z); toast("Caja cerrada ✓"); pintarCajaTab(); };
}

const cjAcciones = {
  borrarV(t) { const v = D.ventas.find(x => x.id === t.dataset.id); if (!v || !confirm("¿Borrar esta venta de " + plata(v.total) + "?")) return; v.borrado = true; v.u = Date.now(); (v.items || []).forEach(i => { if (i.inv) { const x = D.inv.find(y => y.id === i.inv); if (x) { x.stock = (Number(x.stock) || 0) + 1; x.u = Date.now(); subirDoc("i_" + x.id, x); } } }); const f = D.fiados.find(f => f.venta === v.id); if (f) { f.borrado = true; f.u = Date.now(); subirDoc("f_" + f.id, f); } guardar(); subirDoc("v_" + v.id, v); pintarCajaTab(); },
  borrarG(t) { const g = D.gastos.find(x => x.id === t.dataset.id); if (!g || !confirm("¿Borrar este gasto de " + plata(g.monto) + "?")) return; g.borrado = true; g.u = Date.now(); guardar(); subirDoc("g_" + g.id, g); pintarCajaTab(); },
  nuevoF() {
    const G = gente().filter(p => p.nombre);
    const C = hoja("Nuevo fiado", '<div class="small mut">Para deudas que ya tenías anotadas en otro lado. Para fiar un corte nuevo usá «＋ Venta» y escogé «Fiado».</div><label class="l">¿Quién te debe?</label><input type="text" id="nfN" list="nfL" placeholder="Nombre"><datalist id="nfL">' + G.slice(0, 400).map(p => '<option value="' + esc(p.nombre) + '">').join("") + '</datalist><label class="l">¿Cuánto?</label><input type="number" id="nfM" inputmode="decimal" step="0.05"><label class="l">¿De qué?</label><input type="text" id="nfD" placeholder="Ej.: corte del sábado"><button class="btn full" style="margin-top:16px" id="nfOk">Guardar</button>');
    C.onclick = e => { const b = e.target.closest("button"); if (!b || b.id !== "nfOk") return; const n = $("#nfN").value.trim(), m = parseFloat($("#nfM").value); if (!n || !(m > 0)) { toast("Poné nombre y cuánto"); return; } const q = G.find(p => p.nombre.toLowerCase() === n.toLowerCase()); const f = {id:uid(), t:Date.now(), pid:q ? real(q).id : null, nombre:n, tel:q ? q.tel || "" : "", monto:Math.round(m * 100) / 100, desc:$("#nfD").value.trim(), abonos:[], u:Date.now()}; D.fiados.push(f); guardar(); subirDoc("f_" + f.id, f); toast("Fiado guardado"); cerrarHoja(); };
  },
  abonar(t) {
    const f = D.fiados.find(x => x.id === t.dataset.id); if (!f) return; let pago = "efectivo";
    const C = hoja("Pago de " + f.nombre, '<div class="small mut">Debe ' + plata(saldoF(f)) + '</div><label class="l">¿Cuánto te pagó?</label><input type="number" id="abM" inputmode="decimal" step="0.05" value="' + saldoF(f) + '"><label class="l">¿Cómo?</label><div class="chips" id="abP">' + ["efectivo","tarjeta","transferencia"].map(k => '<button class="chip' + (k === pago ? " on" : "") + '" data-p="' + k + '">' + PAGO_N[k] + '</button>').join("") + '</div><button class="btn full" style="margin-top:16px" id="abOk">Guardar pago</button>');
    C.onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.p) { pago = b.dataset.p; C.querySelectorAll("#abP .chip").forEach(x => x.classList.toggle("on", x === b)); return; } if (b.id !== "abOk") return; const m = Math.min(saldoF(f), parseFloat($("#abM").value) || 0); if (!(m > 0)) { toast("Poné cuánto te pagó"); return; } f.abonos = f.abonos || []; f.abonos.push({t:Date.now(), m:Math.round(m * 100) / 100, pago}); if (saldoF(f) <= 0.001) f.pagado = Date.now(); f.u = Date.now(); const v = {id:uid(), t:Date.now(), items:[{n:"Pago de fiado: " + f.nombre, m}], total:Math.round(m * 100) / 100, pago, pid:f.pid, nombre:f.nombre, abono:f.id, u:Date.now()}; D.ventas.push(v); guardar(); subirDoc("f_" + f.id, f); subirDoc("v_" + v.id, v); toast(saldoF(f) <= 0.001 ? "¡" + f.nombre + " ya está al día! ✓" : "Abono guardado · debe " + plata(saldoF(f))); cerrarHoja(); };
  },
  cobrarF(t) { const f = D.fiados.find(x => x.id === t.dataset.id); if (!f) return; const p = (f.pid && D.personas.find(x => x.id === f.pid)) || {nombre:f.nombre, tel:f.tel, red:"whatsapp"}; escribir(p, "¡Qué onda " + (primerNombre(f.nombre) || "") + "! 💈 Te escribo de Meraki para recordarte que quedó pendiente " + plata(saldoF(f)) + (f.desc ? " (" + f.desc + ")" : "") + ". Cuando podás me lo pasás, sin pena. ¡Gracias!"); },
  invMas(t) { const i = D.inv.find(x => x.id === t.dataset.id); if (!i) return; i.stock = (Number(i.stock) || 0) + 1; i.u = Date.now(); guardar(); subirDoc("i_" + i.id, i); pintarCajaTab(); },
  invMenos(t) { const i = D.inv.find(x => x.id === t.dataset.id); if (!i) return; i.stock = (Number(i.stock) || 0) - 1; i.u = Date.now(); guardar(); subirDoc("i_" + i.id, i); pintarCajaTab(); },
  recibi() {
    const L = D.inv.filter(x => !x.borrado); let sel = L[0] && L[0].id;
    const C = hoja("Recibí producto", '<label class="l">¿Qué recibiste?</label><div class="chips" id="rcP" style="flex-wrap:wrap">' + L.map(i => '<button class="chip' + (i.id === sel ? " on" : "") + '" data-i="' + i.id + '">' + esc(i.n) + '</button>').join("") + '</div><label class="l">¿Cuántas unidades?</label><input type="number" id="rcN" inputmode="numeric" min="1" placeholder="Ej.: 24"><label class="l">¿Cuánto pagaste en total? (opcional: se anota como gasto)</label><input type="number" id="rcM" inputmode="decimal" step="0.05" placeholder="$0.00"><button class="btn full" style="margin-top:16px" id="rcOk">Guardar</button>');
    C.onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.i) { sel = b.dataset.i; C.querySelectorAll("#rcP .chip").forEach(x => x.classList.toggle("on", x === b)); return; } if (b.id !== "rcOk") return; const n = parseInt($("#rcN").value, 10), m = parseFloat($("#rcM").value), i = D.inv.find(x => x.id === sel); if (!i || !(n > 0)) { toast("Poné cuántas unidades"); return; } i.stock = (Number(i.stock) || 0) + n; i.u = Date.now(); subirDoc("i_" + i.id, i); if (m > 0) { const g = {id:uid(), t:Date.now(), cat:"bebidas", monto:Math.round(m * 100) / 100, desc:n + " " + i.n, pago:"efectivo", u:Date.now()}; D.gastos.push(g); subirDoc("g_" + g.id, g); } guardar(); toast("+" + n + " " + i.n + (m > 0 ? " · gasto anotado" : "")); cerrarHoja(); };
  },
  nuevoProd() {
    const C = hoja("Producto nuevo", '<label class="l">Nombre</label><input type="text" id="npN" placeholder="Ej.: Pomada, Agua"><label class="l">Precio de venta</label><input type="number" id="npP" inputmode="decimal" step="0.05"><label class="l">Cuántas tenés ahorita</label><input type="number" id="npS" inputmode="numeric" value="0"><label class="l">Avisarme cuando queden</label><input type="number" id="npM" inputmode="numeric" value="3"><button class="btn full" style="margin-top:16px" id="npOk">Guardar</button>');
    C.onclick = e => { const b = e.target.closest("button"); if (!b || b.id !== "npOk") return; const n = $("#npN").value.trim(), p = parseFloat($("#npP").value); if (!n || !(p >= 0)) { toast("Poné nombre y precio"); return; } const i = {id:uid(), n, p:Math.round(p * 100) / 100, stock:parseInt($("#npS").value, 10) || 0, min:parseInt($("#npM").value, 10) || 0, u:Date.now()}; D.inv.push(i); guardar(); subirDoc("i_" + i.id, i); toast(n + " agregado"); cerrarHoja(); };
  },
  cerrar() { cjAcciones._cierre && cjAcciones._cierre(); }
};

pintarTodo();
traerTarjeta(false).catch(() => {}).then(traerCitas).then(() => { pintarTodo(); alarmas(); });
horarioCargar().then(() => { if (!$("#hoja").classList.contains("on") && (vista === "citas" || vista === "hoy")) pintar(); });

</script>
