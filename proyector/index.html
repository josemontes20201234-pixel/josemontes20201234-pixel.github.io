<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyector</title>
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Serif:wght@400;700&family=Noto+Serif+Hebrew:wght@400;700&family=Bebas+Neue&family=Cinzel:wght@400;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Quicksand:wght@400;700&family=Raleway:wght@400;700&family=Roboto+Slab:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Control del proyector: barra "en vivo" arriba, contenido en el medio, pestañas abajo.
   Tinta azul de noche con un solo acento: el rojo "EN VIVO" de una consola de transmisión. */
:root{
  --bg:#0d0e12; --surface:#16181e; --surface-2:#1f222a; --line:#2b2f39;
  --fg:#eceef3; --muted:#9298a6; --accent:#8fb3ff; --accent-soft:rgba(143,179,255,.14); --accent-ink:#0b1020;
  --live:#ff4d4d; --live-soft:rgba(255,77,77,.15); --ok:#5cc495; --bad:#ff7a6b;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{color:var(--fg);font:15.5px/1.5 var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:900px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.lbl{font:800 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}

/* barra en vivo */
.live{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:12px;align-items:center}
.live.grande{grid-template-columns:1fr}
.prev{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.live.grande .prev{cursor:zoom-out}
.prev .badge{position:absolute;left:5px;top:5px;z-index:3;width:9px;height:9px;border-radius:99px;background:var(--live);box-shadow:0 0 0 2px rgba(0,0,0,.55);font-size:0;color:transparent;overflow:hidden}
.livebox{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.livebox > div{min-width:0}
.livebox .now{min-width:0}
.livebox .now b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livebox .now small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.ctl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:800;font-size:clamp(9px,2.6vw,11px);letter-spacing:-.01em;display:grid;place-items:center;gap:2px;min-width:0;overflow:hidden;white-space:nowrap}
.ctl button svg{width:18px;height:18px}
.ctl button.on{background:var(--live-soft);border-color:var(--live);color:var(--live)}
.ctl button:disabled{opacity:.35}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:clamp(10px,2.7vw,11.5px);font-weight:700;color:var(--muted);min-width:0;white-space:nowrap}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.sec{padding-top:14px;display:grid;gap:12px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head h2{font-size:22px;flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--fg)}
.go{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.crumbs button{border:0;background:none;color:var(--accent);padding:4px 2px;font-weight:800}
.crumbs span{color:var(--muted)}
.grid-libros{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.grid-libros button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 2px;font-weight:800;font-size:14px;display:grid;gap:1px}
.grid-libros button small{font-weight:500;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.grid-libros.nt button{border-color:#2f3a52}
.grid-caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.grid-caps button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 0;font:700 15px var(--mono)}
.vlist{display:grid;gap:4px}
.v{display:grid;grid-template-columns:34px minmax(0,1fr) 30px;gap:8px;align-items:start;border:1px solid transparent;background:var(--surface);border-radius:12px;padding:10px 8px 10px 10px;text-align:left;width:100%}
.v .n{font:700 13px var(--mono);color:var(--accent);padding-top:2px}
.v .x{font-size:15px;line-height:1.45}
.v .x mark{background:rgba(143,179,255,.28);color:inherit;border-radius:3px}
.v.on{border-color:var(--live);background:var(--live-soft)}
.star{border:0;background:none;padding:2px;color:var(--muted);font-size:18px;line-height:1}
.star.on{color:#f3c64d}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.list{display:grid;gap:6px}
.row-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
.row-item b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estrofas{display:grid;gap:8px}
.estrofa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;white-space:pre-line;font-size:15px;line-height:1.45;width:100%;position:relative}
.estrofa .k{position:absolute;right:10px;top:8px;font:700 11px var(--mono);color:var(--muted)}
.estrofa.on{border-color:var(--live);background:var(--live-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fondo{position:relative;aspect-ratio:16/9;border-radius:10px;border:2px solid transparent;overflow:hidden;padding:0;background:#000}
.fondo span{position:absolute;left:6px;bottom:4px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.fondo.on{border-color:var(--accent)}
.fondo img{width:100%;height:100%;object-fit:cover;display:block}
.fondo .del{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:99px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13px;display:grid;place-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.sw input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.field{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.field > span{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.colors{display:flex;gap:10px;align-items:center}
.colors input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:420px){.two.st{grid-template-columns:1fr}}

.scrim{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;font-size:22px}
.iconbtn{width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.form input,.form textarea,.form select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--fg);font-weight:500}
.form textarea{min-height:200px;resize:vertical;line-height:1.45}
.confirm{background:rgba(255,122,107,.12);border-radius:12px;padding:12px;display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw;text-align:center}
.link{display:grid;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px}
.link code{font:600 13px var(--mono);word-break:break-all;user-select:all}
.hero{padding-block:48px 20px;display:grid;gap:14px}
.hero h1{font-size:clamp(44px,13vw,72px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--live)}

#modotele{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#modotele .mt-esc{position:absolute;top:0;left:0;right:0;bottom:0}
#modotele .mt-ayuda{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.72);color:#fff;font:600 13px/1.4 var(--body);padding:8px 14px;border-radius:99px;text-align:center;max-width:92vw;transition:opacity .6s;pointer-events:none}
#modotele .mt-ayuda.off{opacity:0}
#modotele .mt-bar{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:flex;gap:6px;background:rgba(13,14,18,.92);padding:8px;border-radius:16px;border:1px solid var(--line);max-width:calc(100vw - 24px)}
#modotele .mt-bar button{border:0;background:var(--surface-2);color:var(--fg);border-radius:10px;padding:8px 10px;font:800 12px var(--body);display:grid;place-items:center;gap:2px;min-width:54px}
#modotele .mt-bar button svg{width:18px;height:18px}
#modotele .mt-bar .mt-salir{background:var(--live-soft);color:var(--live)}

.v .acc{display:grid;gap:4px;justify-items:center}
.studybtn{border:0;background:none;padding:2px;color:var(--muted);line-height:0}
.studybtn svg{width:18px;height:18px}
.inter{display:flex;flex-wrap:wrap;gap:6px}
.inter.rtl{direction:rtl}
.pal{direction:ltr;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 9px;display:grid;gap:1px;text-align:center;min-width:64px;max-width:100%}
.pal .o{font:600 21px/1.25 'Noto Serif','Noto Serif Hebrew',serif;color:var(--fg)}
.pal .tr{font-size:11.5px;color:var(--muted);font-style:italic}
.pal .gl{font-size:13px;font-weight:700;color:var(--accent)}
.pal .sn{font:600 10.5px var(--mono);color:var(--muted)}
.pal.on{border-color:var(--accent);background:var(--accent-soft)}
.det{display:grid;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px}
.det .lem{font:700 28px/1.2 'Noto Serif','Noto Serif Hebrew',serif}
.det .def{white-space:pre-line;font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.det dt{color:var(--muted)} .det dd{margin:0;font-weight:700}
.orig{font:500 22px/1.6 'Noto Serif','Noto Serif Hebrew',serif}
.credit{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="escena-css"></style>
</head>
<body>
<div id="app"><div class="hero"><h1>Proyector<span>.</span></h1><p class="muted">Cargando…</p></div></div>
<div class="tabs" id="tabs" hidden><nav></nav></div>
<div id="sheet"></div>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}))}</script>
</body>
</html>
