<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meraki Barbershop</title>
<meta name="description" content="Tarjeta de fidelidad digital de Meraki Barbershop, Apopa.">
<meta name="theme-color" content="#0d0c0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#0d0c0a; --surface:#16140f; --surface2:#1f1c15; --line:#332d20;
  --fg:#f1ead9; --muted:#a59b84; --gold:#c9a24a; --gold-hi:#e6c46d; --gold-ink:#1a1408;
  --ok:#6fbf8a; --warn:#e0a14a; --bad:#d9675a; --wa:#3fbf6a;
  --f-display:"Bodoni Moda","Didot","Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:18px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(26px,5vw,34px);letter-spacing:.02em}
.brand h1 em{color:var(--gold);font-style:italic}
.brand .sub{color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
nav.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--gold)}
.banner{margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}
.banner[data-kind="warn"]{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
section.view{padding-top:22px;display:flex;flex-direction:column;gap:22px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1}
.stat.click:hover{border-color:var(--gold)}
.stat .hint{font-size:12px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--fg);font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.wa{border-color:color-mix(in srgb,var(--wa) 55%,transparent);color:var(--wa);background:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.lg{padding:14px 22px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:linear-gradient(160deg,var(--surface2),var(--surface) 70%);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.just{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;align-items:center}
.tier{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.tier.bronce{color:#c58a5a;border-color:#5a3d26}
.tier.plata{color:#c8ccd2;border-color:#4b4f55}
.tier.oro{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.tier.app{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state.premio{color:var(--gold-hi)} .state.inactivo{color:var(--warn)} .state.activo{color:var(--ok)}

.stamps{display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:6px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--gold-ink)}
.stamp.on{border:0;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 60%,#9a7a30)}
.stamp.on svg{width:58%;height:58%}
.stamp.last{border-color:var(--gold);border-style:solid}
.stamp.last:not(.on) svg{color:var(--gold);width:55%;height:55%}
.stamps.big{gap:10px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet .x{position:absolute;right:14px;top:12px;background:none;border:0;color:var(--muted);font-size:26px;line-height:1;padding:6px}
.sheet h2{font-size:28px;padding-right:36px;overflow-wrap:anywhere}
.loyal{border-radius:18px;padding:18px;background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 60%),linear-gradient(150deg,#1d1a12,#0f0e0b);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));display:flex;flex-direction:column;gap:14px}
.loyal .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.loyal .wm{font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:20px}
.loyal .count{font-family:var(--f-display);font-size:24px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist li span:last-child{color:var(--muted)}
.notify{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;overflow-wrap:anywhere}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.grid .full{grid-column:1/-1}
@media (max-width:520px){form.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:92px;resize:vertical}
.field small{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:24px}
.panel p{margin:0;color:var(--muted);max-width:65ch}
.recips{display:flex;flex-direction:column}
.recip{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.recip .who{flex:1 1 160px;min-width:0}
.recip .who b{display:block;overflow-wrap:anywhere}
.recip .who span{font-size:12px;color:var(--muted)}
.recip.sent .who b{color:var(--muted);text-decoration:line-through}
.vars{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.vars code{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--gold-hi)}
.qrcard{width:100%;max-width:100%;aspect-ratio:1080/680;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:block}
.scanned{border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.hint-sm{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--bad)}

/* Escáner */
.scanner{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .frame{position:absolute;left:50%;top:45%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--gold);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%)}

/* Cliente */
.client{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:22px}
.qrbox{background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#0d0c0a}
.qrbox svg{width:min(64vw,260px);height:auto;display:block}
.qrbox .num{font-size:15px;letter-spacing:.08em}
.premio-banner{border-radius:var(--r);padding:16px;background:var(--gold);color:var(--gold-ink);font-weight:700;display:flex;flex-direction:column;gap:4px}
.premio-banner h3{font-size:22px}

/* Login */
.hero{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:460px;margin:0 auto;padding-block:40px}
.hero h1{font-size:clamp(44px,12vw,64px);line-height:1}
.hero h1 em{color:var(--gold)}
.hero p{color:var(--muted);margin:0;font-size:16px}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps b{font-family:var(--f-display);color:var(--gold);font-size:22px;line-height:1;min-width:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast a,.toast button{color:var(--bg);background:none;border:0;font-weight:700;text-decoration:underline;padding:0}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translate(-50%,24px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
  .stamp.on.fresh{animation:pop .4s ease-out}
  @keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando Meraki…</div></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module" src="app.js"></script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
