name: Leo — probar conversaciones (herramientas simuladas, datos inventados)
on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Escenas a correr, separadas por coma (vacío = todas)"
        required: false
        default: ""
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escenarios
        env:
          K: ${{ secrets.LEO_ANTHROPIC_KEY }}
          SOLO: ${{ inputs.solo }}
        run: node .github/scripts/leo-escenarios.mjs
