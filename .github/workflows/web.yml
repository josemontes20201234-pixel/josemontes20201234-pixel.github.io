name: Meraki web (merakibarbershop.com)
# Publica el worker que hace que merakibarbershop.com muestre la página de /meraki/.
# La ruta del dominio (*merakibarbershop.com/*, cubre con y sin www) se agregó a mano en el panel de Cloudflare.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Cloudflare ya tiene el dominio activo?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          r=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=merakibarbershop.com")
          estado=$(echo "$r" | python3 -c "import sys,json; d=json.load(sys.stdin); z=d.get('result') or []; print(z[0].get('status','') if z else ('no-visible' if d.get('success') else 'sin-permiso'))")
          echo "Estado del dominio en Cloudflare: $estado"
          echo "(La ruta *merakibarbershop.com/* está en el panel de Cloudflare: la llave no tiene permiso de rutas)"
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bcefe39d21eb6d4d1db006a3f7db17a9
          workingDirectory: web
      - name: Probar
        run: |
          sleep 15
          for u in \
            https://meraki-web.merakibarbershop.workers.dev/ \
            https://merakibarbershop.com/ \
            https://www.merakibarbershop.com/academia/ \
            http://merakibarbershop.com/ \
            https://merakibarbershop.com/academia/ \
            https://merakibarbershop.com/visagismo/ \
            https://merakibarbershop.com/aniversario/ \
            https://merakibarbershop.com/meraki/visagismo/ \
            https://merakibarbershop.com/citas/ \
            https://merakibarbershop.com/estilo.css \
            https://merakibarbershop.com/ig/galeria.json \
            https://merakibarbershop.com/robots.txt \
            https://merakibarbershop.com/sitemap.xml \
            https://merakibarbershop.com/no-existe \
            https://merakibarbershop.com/img/no-existe.webp; do
            rm -f /tmp/p.html
            r=$(curl -s -o /tmp/p.html -w "%{http_code} %{content_type} %{redirect_url}" --max-time 20 "$u" || echo "sin respuesta")
            t=$(grep -o "<title>[^<]*" /tmp/p.html 2>/dev/null | head -1 | sed 's/<title>//')
            echo "$u -> $r ${t:+| $t}"
          done
          curl -s --max-time 20 https://merakibarbershop.com/ | grep -o '<link rel="canonical"[^>]*>' || echo "sin canonical"
          for f in visagismo/escaner/vision_bundle.mjs visagismo/escaner/wasm/vision_wasm_internal.js visagismo/escaner/wasm/vision_wasm_internal.wasm visagismo/escaner/face_landmarker.task visagismo/escaner.js visagismo/medidas.js img/leo-avatar.webp; do
            curl -s -o /dev/null -D /tmp/h.txt -H "accept-encoding: gzip, br" -w "%{http_code} bajó=%{size_download}" --max-time 60 "https://merakibarbershop.com/$f" > /tmp/r.txt
            echo "$f -> $(cat /tmp/r.txt) | $(grep -i '^content-type' /tmp/h.txt | tr -d '\r') | $(grep -i '^content-encoding' /tmp/h.txt | tr -d '\r') | $(grep -i '^cache-control' /tmp/h.txt | tr -d '\r')"
          done
          echo "Leo por internet (debe ser 404): $(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 20 https://meraki-leo.merakibarbershop.workers.dev/web/chat)"
          echo "chat de otro sitio (debe ser 403): $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://otro.com' -H 'content-type: application/json' -d '{}' --max-time 20 https://merakibarbershop.com/api/leo)"
          printf "chat de Leo -> "
          curl -s --max-time 90 -X POST -H "content-type: application/json" -H "origin: https://merakibarbershop.com" \
            -d "{\"id\":\"prueba-web-${GITHUB_RUN_ID}-x\",\"texto\":\"Hola, ¿cuánto cuesta el corte clásico?\"}" https://merakibarbershop.com/api/leo | head -c 700; echo
          curl -s -o /dev/null -r 0-99 --max-time 20 -w "video de Leo -> %{http_code} %{content_type}\n" https://merakibarbershop.com/leo/media/leo-presentacion.mp4 || echo "video de Leo -> sin respuesta"
