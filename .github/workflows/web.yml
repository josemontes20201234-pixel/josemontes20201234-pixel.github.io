name: Meraki web (merakibarbershop.com)
# Publica el worker que hace que merakibarbershop.com muestre la página de /meraki/.
# Las rutas del dominio se agregan solo cuando Cloudflare ya tiene el dominio activo.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Cloudflare ya tiene el dominio activo?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          r=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=merakibarbershop.com")
          estado=$(echo "$r" | python3 -c "import sys,json; d=json.load(sys.stdin); z=d.get('result') or []; print(z[0].get('status','') if z else ('no-visible' if d.get('success') else 'sin-permiso'))")
          echo "Estado del dominio en Cloudflare: $estado"
          if [ "$estado" = "active" ]; then
            printf '\nroutes = [\n  { pattern = "merakibarbershop.com/*", zone_name = "merakibarbershop.com" },\n  { pattern = "www.merakibarbershop.com/*", zone_name = "merakibarbershop.com" }\n]\n' >> web/wrangler.toml
            echo "Se agregan las rutas de merakibarbershop.com"
          fi
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bcefe39d21eb6d4d1db006a3f7db17a9
          workingDirectory: web
      - name: Probar
        run: |
          sleep 10
          for u in https://meraki-web.merakibarbershop.workers.dev/ https://meraki-web.merakibarbershop.workers.dev/academia https://merakibarbershop.com/ https://www.merakibarbershop.com/; do
            r=$(curl -s -o /tmp/p.html -w "%{http_code} %{redirect_url}" --max-time 20 "$u" || echo "sin respuesta")
            t=$(grep -o "<title>[^<]*" /tmp/p.html 2>/dev/null | head -1 | sed 's/<title>//')
            echo "$u -> $r | $t"
          done
