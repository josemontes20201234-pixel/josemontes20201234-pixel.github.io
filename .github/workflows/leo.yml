name: Leo (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ['leo/**', '.github/workflows/leo.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar dirección workers.dev (si no existe)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          cur=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain)
          echo "$cur" | head -c 300; echo
          if ! echo "$cur" | grep -q '"subdomain":"'; then
            curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"subdomain":"merakibarbershop"}' https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain | head -c 400; echo
          fi
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bcefe39d21eb6d4d1db006a3f7db17a9
          workingDirectory: leo
