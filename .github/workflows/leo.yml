name: Leo (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ['leo/**', '.github/workflows/leo.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar dirección workers.dev (si no existe)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          cur=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain)
          echo "$cur" | head -c 300; echo
          if ! echo "$cur" | grep -q '"subdomain":"'; then
            curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"subdomain":"merakibarbershop"}' https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain | head -c 400; echo
          fi
      - name: Preparar memoria de Leo (KV)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          H="Authorization: Bearer $CF_TOKEN"
          B=https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces
          id=$(curl -s -H "$H" "$B?per_page=100" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((n['id'] for n in (d.get('result') or []) if n['title']=='meraki-leo-memoria'),''))")
          if [ -z "$id" ]; then
            id=$(curl -s -X POST -H "$H" -H "Content-Type: application/json" --data '{"title":"meraki-leo-memoria"}' "$B" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('id',''))")
          fi
          if [ -z "$id" ]; then echo "::error::No se pudo crear la memoria (KV)"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "LEO"\nid = "%s"\n' "$id" >> leo/wrangler.toml
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bcefe39d21eb6d4d1db006a3f7db17a9
          workingDirectory: leo
          secrets: |
            LEO_ANTHROPIC_KEY
            META_APP_SECRET
        env:
          LEO_ANTHROPIC_KEY: ${{ secrets.LEO_ANTHROPIC_KEY }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      - name: Llave de Instagram para Leo (si ya está en GitHub)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T: ${{ secrets.META_IG_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "Todavía no hay META_IG_TOKEN en GitHub: se salta"; exit 0; fi
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          python3 -c "import json,os; print(json.dumps({'name':'META_IG_TOKEN','text':os.environ['T'],'type':'secret_text'}))" > "$RUNNER_TEMP/s.json"
          curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/s.json" \
            https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/meraki-leo/secrets \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Llave guardada en Leo' if d.get('success') else d.get('errors'))"
          rm -f "$RUNNER_TEMP/s.json"
      - name: Revisar a Leo (sin mostrar llaves)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S: ${{ secrets.META_APP_SECRET }}
        run: |
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          sub=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))")
          echo "Dirección: https://meraki-leo.$sub.workers.dev"
          sleep 10
          echo "Suscribir la cuenta de Instagram:"
          curl -s -X POST -H "x-diag: $S" "https://meraki-leo.$sub.workers.dev/suscribir" | python3 -m json.tool || true
          echo "Estado:"
          curl -s -H "x-diag: $S" "https://meraki-leo.$sub.workers.dev/diag" | python3 -m json.tool || true
