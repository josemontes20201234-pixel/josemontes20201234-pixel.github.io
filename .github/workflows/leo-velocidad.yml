name: Leo (comparar velocidad)
on:
  workflow_dispatch:
jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparar cerebros de Leo
        env:
          K: ${{ secrets.LEO_ANTHROPIC_KEY }}
        run: node .github/scripts/leo-velocidad.mjs
