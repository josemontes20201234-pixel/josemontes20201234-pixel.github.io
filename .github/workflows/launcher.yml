name: Meraki Launcher APK
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: gradle -p launcher assembleRelease --no-daemon --stacktrace
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk meraki-launcher.apk
          gh release create "launcher-${GITHUB_RUN_NUMBER}" meraki-launcher.apk \
            --title "Meraki Launcher 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Descargá meraki-launcher.apk e instalalo en tu Android." --latest
