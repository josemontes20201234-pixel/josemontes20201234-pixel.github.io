name: Leo · adjuntos (solo la forma, sin datos)
on:
  workflow_dispatch:
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Ver cómo vienen los últimos mensajes (sin textos, nombres ni enlaces)
        env:
          T: ${{ secrets.META_IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, re, datetime as dt, urllib.request, urllib.parse, urllib.error
          T = os.environ["T"]; IG = "17841479582218392"
          def get(ruta):
              req = urllib.request.Request("https://graph.facebook.com/v23.0/" + ruta, headers={"authorization": "Bearer " + T})
              try: return json.load(urllib.request.urlopen(req, timeout=30)), None
              except urllib.error.HTTPError as e:
                  try: return None, (json.load(e).get("error") or {}).get("message")
                  except Exception: return None, str(e)
          def forma_url(u):
              p = urllib.parse.urlparse(u); ext = re.findall(r"\.([a-z0-9]{2,4})$", p.path.lower())
              return p.netloc + " ." + (ext[0] if ext else "?")
          def forma(o):
              if isinstance(o, dict):
                  return {k: (forma_url(v) if isinstance(v, str) and v.startswith("http") else (re.sub(r"\d", "9", v)[:40] if k in ("name", "mime_type", "type", "image_type") and isinstance(v, str) else (v if isinstance(v, (bool, int, float)) else forma(v)))) for k, v in o.items() if k not in ("id", "username", "message", "email")}
              if isinstance(o, list): return [forma(x) for x in o[:3]]
              return "(texto)" if isinstance(o, str) else o
          hora = lambda t: (dt.datetime.strptime(t[:19], "%Y-%m-%dT%H:%M:%S") - dt.timedelta(hours=6)).strftime("%H:%M:%S")
          campos = "updated_time,messages.limit(4){id,created_time,from,message,attachments{mime_type,name,size,file_url,image_data,video_data},shares{name,link},story}"
          d, err = get(IG + "/conversations?platform=instagram&limit=3&fields=" + urllib.parse.quote(campos))
          if err: print("ERROR lista:", err); raise SystemExit
          ultimo_cliente = None
          for i, c in enumerate(d.get("data") or []):
              print(f"chat {i+1} · actualizado {hora(c['updated_time'])}")
              for m in ((c.get("messages") or {}).get("data") or []):
                  quien = "NEGOCIO" if str((m.get("from") or {}).get("id")) == IG else "cliente"
                  extra = {k: v for k, v in m.items() if k not in ("id", "created_time", "from", "message")}
                  print(f"   {hora(m['created_time'])} {quien} · texto: {'sí' if m.get('message') else 'NO'} · claves: {sorted(m.keys())} · {json.dumps(forma(extra), ensure_ascii=False)[:300]}")
                  if quien == "cliente" and not m.get("message") and not ultimo_cliente: ultimo_cliente = m["id"]
          if ultimo_cliente:
              print("--- mensaje sin texto: probando campos uno por uno")
              for f in ["attachments", "attachments{mime_type,name,size,file_url,image_data,video_data}", "shares", "story", "sticker", "is_unsupported", "tags", "reactions", "reply_to", "audio_data"]:
                  r, err = get(ultimo_cliente + "?fields=" + urllib.parse.quote(f))
                  print(f"   {f[:40]:40} ->", ("ERROR " + str(err)[:120]) if err else json.dumps(forma({k: v for k, v in r.items() if k != 'id'}), ensure_ascii=False)[:300])
          PY
