name: Leo · adjuntos (solo la forma, sin datos)
on:
  workflow_dispatch:
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Ver cómo vienen audios, fotos y stickers (sin textos, nombres ni enlaces)
        env:
          T: ${{ secrets.META_IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request, urllib.parse, urllib.error
          T = os.environ["T"]; IG = "17841479582218392"
          variantes = [
            "messages.limit(15){id,created_time,from,message,attachments{id,mime_type,name,size,file_url,image_data,video_data},shares{id,name,link,description,template},story}",
            "messages.limit(15){id,created_time,from,message,attachments{id,name,file_url,image_data,video_data},shares{id,name,link,description},story}",
            "messages.limit(15){id,created_time,from,message,attachments}",
          ]
          def forma_url(u):
              if not isinstance(u, str) or not u: return None
              p = urllib.parse.urlparse(u)
              ext = re.findall(r"\.([a-z0-9]{2,4})$", p.path.lower())
              return p.netloc + " ." + (ext[0] if ext else "?") + (" (con firma)" if "signature" in p.query or "oe=" in p.query else "")
          def forma(o, prof=0):
              if isinstance(o, dict):
                  return {k: (forma_url(v) if isinstance(v, str) and v.startswith("http") else (re.sub(r"\d", "9", v)[:40] if k in ("name", "mime_type", "type", "image_type") and isinstance(v, str) else (v if isinstance(v, (bool, int, float)) else forma(v, prof + 1)))) for k, v in o.items() if k not in ("id",)}
              if isinstance(o, list): return [forma(x, prof + 1) for x in o[:3]]
              return "(texto)" if isinstance(o, str) else o
          for campos in variantes:
              url = "https://graph.facebook.com/v23.0/" + IG + "/conversations?platform=instagram&limit=10&fields=" + urllib.parse.quote(campos)
              req = urllib.request.Request(url, headers={"authorization": "Bearer " + T})
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  print("ERROR con la variante", variantes.index(campos) + 1, "->", (json.load(e).get("error") or {}).get("message")); continue
              print("Variante", variantes.index(campos) + 1, "funciona. Chats:", len(d.get("data") or []))
              n = 0
              for i, c in enumerate(d.get("data") or []):
                  for m in ((c.get("messages") or {}).get("data") or []):
                      extra = {k: m[k] for k in ("attachments", "shares", "story") if k in m}
                      if not extra: continue
                      n += 1
                      print(f"chat {i+1} · mensaje con texto: {'sí' if m.get('message') else 'no'} ·", json.dumps(forma(extra), ensure_ascii=False))
              print("Mensajes con adjuntos:", n)
              break
          PY
