name: Leo (revisar)
on:
  workflow_dispatch:
    inputs:
      reiniciar:
        description: Que Leo empiece de cero (los mensajes de antes no cuentan) (si/no)
        default: "no"
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar a Leo (sin mostrar llaves ni mensajes)
        env:
          S: ${{ secrets.META_APP_SECRET }}
        run: |
          date -u
          if [ "${{ inputs.reiniciar }}" = "si" ]; then curl -s -X POST -H "x-diag: $S" "https://meraki-leo.merakibarbershop.workers.dev/reiniciar"; echo; fi
          curl -s -H "x-diag: $S" "https://meraki-leo.merakibarbershop.workers.dev/diag?ligero=1" > "$RUNNER_TEMP/d.json" || true
          python3 - "$RUNNER_TEMP/d.json" <<'PY'
          import sys, json, datetime as dt
          try: d = json.load(open(sys.argv[1]))
          except Exception as e: print("no se pudo leer /diag:", e); sys.exit(0)
          llave = d.get('llave') if isinstance(d.get('llave'), dict) else {}
          llave.pop('permisos', None)
          print(json.dumps({k: d.get(k) for k in ('modo','uso_meta_ultimo','revisa_desde','ultima_revision','ultimo_envio','ruta_instagram')}, indent=2, ensure_ascii=False))
          print('mensajes_directos:', llave.get('mensajes_directos', '(no se revisó, para no gastar llamadas de Meta)'))
          print("\n=== CRONÓMETRO (hora de El Salvador) ===")
          for r in d.get('ultimas_respuestas') or []:
              h = (dt.datetime.fromisoformat(r['cuando'].replace('Z', '+00:00')) - dt.timedelta(hours=6)).strftime('%H:%M:%S')
              for x in r.get('informe') or []:
                  print(h, '|', r.get('motivo'), '|', x.get('paso'), '|', json.dumps(x.get('segundos') or {}, ensure_ascii=False), '| burbujas', x.get('burbujas'), '| botones', x.get('botones'), ('| error ' + x['error']) if x.get('error') else '')
          PY
      - name: ¿Cloudflare cortó a Leo por CPU? (últimas 24 h, sin datos de nadie)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          fin = dt.datetime.now(dt.timezone.utc).replace(microsecond=0); ini = fin - dt.timedelta(hours=24)
          q = """query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:20,filter:{scriptName:"meraki-leo",datetime_geq:$s,datetime_leq:$e}){sum{requests errors}quantiles{cpuTimeP50 cpuTimeP99}dimensions{status}}}}}"""
          body = json.dumps({"query": q, "variables": {"a": "bcefe39d21eb6d4d1db006a3f7db17a9", "s": ini.isoformat().replace("+00:00","Z"), "e": fin.isoformat().replace("+00:00","Z")}}).encode()
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=body, headers={"Authorization": "Bearer " + os.environ["CF_TOKEN"], "Content-Type": "application/json"})
          try:
              d = json.load(urllib.request.urlopen(req, timeout=30))
              if d.get("errors"): print("Cloudflare no dejó ver esto:", [e.get("message") for e in d["errors"]][:2])
              for f in (((d.get("data") or {}).get("viewer") or {}).get("accounts") or [{}])[0].get("workersInvocationsAdaptive") or []:
                  print("estado:", f["dimensions"]["status"], "| veces:", f["sum"]["requests"], "| CPU típico ms:", round(f["quantiles"]["cpuTimeP50"]/1000, 1), "| CPU máximo (p99) ms:", round(f["quantiles"]["cpuTimeP99"]/1000, 1))
          except Exception as e:
              print("no se pudo consultar:", str(e)[:200])
          PY
