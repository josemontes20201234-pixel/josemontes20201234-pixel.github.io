name: Meraki CRM APK
on:
  push:
    branches: [main]
    paths: ['crm/**', '.github/workflows/crm.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        env:
          ENFOQUE_KEY_PASSWORD: ${{ secrets.ENFOQUE_KEY_PASSWORD }}
        run: |
          if [ -z "$ENFOQUE_KEY_PASSWORD" ]; then echo "::error::Falta el secreto ENFOQUE_KEY_PASSWORD en Settings > Secrets and variables > Actions"; exit 1; fi
          gradle -p crm assembleRelease --no-daemon --stacktrace
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp crm/app/build/outputs/apk/release/app-release.apk meraki-crm.apk
          gh release view meraki-crm >/dev/null 2>&1 || gh release create meraki-crm --title "Meraki CRM" --notes "Descargá meraki-crm.apk e instalalo en tu Android." --latest=false
          gh release upload meraki-crm meraki-crm.apk --clobber
          gh release edit meraki-crm --notes "Meraki CRM 1.0.${GITHUB_RUN_NUMBER}. Descargá meraki-crm.apk e instalalo en tu Android." --latest=false
