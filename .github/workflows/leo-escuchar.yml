name: Leo (escuchar)
on:
  workflow_dispatch:
    inputs:
      segundos:
        description: Cuántos segundos escuchar
        default: "150"
      probar:
        description: Hacer una pregunta de prueba para medir CPU (si/no)
        default: "si"
jobs:
  escuchar:
    runs-on: ubuntu-latest
    steps:
      - name: Reloj de cada minuto en Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/meraki-leo/schedules \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('result'), indent=2) if d.get('success') else d.get('errors'))"
      - name: Escuchar a Leo (solo resultados, sin datos de nadie)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bcefe39d21eb6d4d1db006a3f7db17a9
        run: |
          # A los 40 s se le hace una pregunta de prueba (página de prueba, sin Instagram) para medir cuánto CPU gasta una respuesta con agenda
          if [ "${{ inputs.probar }}" != "no" ]; then ( sleep 40; curl -s -o /dev/null -w "prueba de respuesta: http %{http_code} en %{time_total} s\n" -X POST -H "content-type: application/json" \
              -d '{"id":"medir-cpu","texto":"¿Tenés espacio hoy?"}' https://meraki-leo.merakibarbershop.workers.dev/probar/chat ) & fi
          timeout "${{ inputs.segundos || 150 }}" npx --yes wrangler@4 tail meraki-leo --format json > "$RUNNER_TEMP/t.txt" 2>"$RUNNER_TEMP/e.txt" || true
          wait
          python3 - "$RUNNER_TEMP/t.txt" <<'PY'
          import sys, json
          txt = open(sys.argv[1]).read()
          dec = json.JSONDecoder(); i = 0; n = 0; textos = []
          while True:
              k = txt.find("{", i)
              pre = txt[i:(k if k >= 0 else len(txt))].strip()
              if pre: textos.append(pre[:160])
              if k < 0: break
              try: ev, j = dec.raw_decode(txt, k)
              except Exception:
                  i = k + 1; continue
              i = j; n += 1
              e = ev.get("event") or {}
              tipo = "cada minuto" if "cron" in e else ("aviso/pagina" if "request" in e else "otro")
              if "request" in e:  # solo la ruta y el resultado (nada de encabezados ni datos)
                  from urllib.parse import urlparse
                  import datetime
                  hora = datetime.datetime.utcfromtimestamp((ev.get("eventTimestamp") or 0) / 1000) - datetime.timedelta(hours=6)
                  tipo = "pedido " + urlparse(e["request"].get("url", "")).path + " -> " + str((e.get("response") or {}).get("status")) + " a las " + hora.strftime("%H:%M:%S") + " (hora SV)"
              print(tipo, "| resultado:", ev.get("outcome"), "| cpu ms:", ev.get("cpuTime"), "| duró ms:", ev.get("wallTime"), "| errores:", [str(x.get("message"))[:200] for x in ev.get("exceptions") or []], "| notas:", [str(x.get("message"))[:200] for x in ev.get("logs") or []])
          print("eventos escuchados:", n)
          print("texto de wrangler:", textos[:4])
          PY
          echo "--- avisos de wrangler ---"; grep -vE "^\s*$" "$RUNNER_TEMP/e.txt" | cut -c1-200 | tail -8 || true
