name: Leo (escuchar)
on:
  workflow_dispatch:
jobs:
  escuchar:
    runs-on: ubuntu-latest
    steps:
      - name: Reloj de cada minuto en Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=bcefe39d21eb6d4d1db006a3f7db17a9
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/meraki-leo/schedules \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('result'), indent=2) if d.get('success') else d.get('errors'))"
      - name: Escuchar a Leo (solo resultados, sin datos de nadie)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bcefe39d21eb6d4d1db006a3f7db17a9
        run: |
          timeout 120 npx --yes wrangler@4 tail meraki-leo --format json > "$RUNNER_TEMP/t.txt" 2>"$RUNNER_TEMP/e.txt" || true
          python3 - "$RUNNER_TEMP/t.txt" <<'PY'
          import sys, json
          txt = open(sys.argv[1]).read()
          dec = json.JSONDecoder(); i = 0; n = 0
          while i < len(txt):
              while i < len(txt) and txt[i] in " \n\r\t": i += 1
              if i >= len(txt): break
              try: ev, j = dec.raw_decode(txt, i)
              except Exception: break
              i = j; n += 1
              e = ev.get("event") or {}
              tipo = "cada minuto" if "cron" in e else ("aviso/pagina" if "request" in e else "otro")
              print(tipo, "| resultado:", ev.get("outcome"), "| errores:", [str(x.get("message"))[:200] for x in ev.get("exceptions") or []], "| notas:", [str(x.get("message"))[:200] for x in ev.get("logs") or []])
          print("eventos escuchados:", n)
          PY
          grep -iE "error|connected|listening" "$RUNNER_TEMP/e.txt" | tail -5 || true
