name: Meraki Enfoque APK
on:
  push:
    branches: [main]
    paths: ['enfoque/**', '.github/workflows/enfoque.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: gradle -p enfoque assembleRelease --no-daemon --stacktrace
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp enfoque/app/build/outputs/apk/release/app-release.apk meraki-enfoque.apk
          gh release create "enfoque-${GITHUB_RUN_NUMBER}" meraki-enfoque.apk \
            --title "Meraki Enfoque 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Descargá meraki-enfoque.apk e instalalo en tu Android." --latest=false
