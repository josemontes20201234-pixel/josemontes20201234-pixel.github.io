<!doctype html>
<html lang="es-SV">
<head>
<meta charset="utf-8">
<script>
/* Si el navegador de la tele no entiende algo, lo mostramos en pantalla para poder arreglarlo */
window.onerror=function(m,src,l){if(/^Script error/i.test(m||''))return;try{var d=document.getElementById('errtv');if(!d){d=document.createElement('div');d.id='errtv';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#7a1d1d;color:#fff;font:600 18px/1.4 sans-serif;padding:12px 18px';document.documentElement.appendChild(d)}d.textContent='Error del navegador: '+m+' (línea '+l+'). '+navigator.userAgent}catch(e){}};
</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Meraki Academy: aprendé barbería desde la historia hasta la maestría.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Meraki Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — sticky top bar, one content column (max 760px), fixed bottom tab bar.
   One bold motif: the barber-pole stripe. Everything else is black, brass gold and quiet type. */
:root{
  --bg:#0b0b0a; --surface:#151512; --surface-2:#1e1d19; --line:#2e2c26;
  --fg:#efe9dc; --muted:#a19b8d; --brass:#d1a957; --brass-soft:rgba(209,169,87,.14); --brass-ink:#14100a;
  --red:#c2413a; --blue:#3d67a8; --pole-white:#f3efe6;
  --ok:#62b68c; --ok-soft:rgba(98,182,140,.14); --bad:#e26a5c; --bad-soft:rgba(226,106,92,.14);
  --skin:#cfa88c; --skin-2:#b78f74; --hair:#6a5444; --hair-dark:#3a2d24;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f1ec; --surface:#ffffff; --surface-2:#e8e6df; --line:#d3d0c6;
  --fg:#16150f; --muted:#5f5b50; --brass:#8c661c; --brass-soft:rgba(140,102,28,.12); --brass-ink:#fffaf0;
  --ok:#27855a; --ok-soft:rgba(39,133,90,.12); --bad:#b8402f; --bad-soft:rgba(184,64,47,.1);
  --hair:#3f3026; --hair-dark:#241a14; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f2f1ec; --surface:#ffffff; --surface-2:#e8e6df; --line:#d3d0c6;
  --fg:#16150f; --muted:#5f5b50; --brass:#8c661c; --brass-soft:rgba(140,102,28,.12); --brass-ink:#fffaf0;
  --ok:#27855a; --ok-soft:rgba(39,133,90,.12); --bad:#b8402f; --bad-soft:rgba(184,64,47,.1);
  --hair:#3f3026; --hair-dark:#241a14; color-scheme:light }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.lbl{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

.pole{height:8px;border-radius:99px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--pole-white) 12px 24px,var(--blue) 24px 36px,var(--pole-white) 36px 48px);animation:pole 2.4s linear infinite}
@keyframes pole{to{background-position:67.88px 0}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{font:900 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--brass)}
.top .sp{flex:1}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--brass);background:var(--brass-soft)}

/* home */
.hero{padding-block:26px 8px;display:grid;gap:14px}
.hero h1{font-size:clamp(54px,15vw,96px);font-weight:900}
.hero h1 em{font-style:normal;color:var(--brass);display:block}
.hero .lead{font-size:17px;color:var(--muted);max-width:34ch}
.progress-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.ring{width:84px;height:84px}
.ring text{font:800 20px var(--mono);fill:var(--fg)}
.progress-card .full{grid-column:1/-1}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 12px;font:inherit}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--brass);color:var(--brass-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.shortcut{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 12px;text-align:left;display:grid;gap:4px}
.shortcut b{font:800 20px/1 var(--display);text-transform:uppercase}
.shortcut span{font-size:12.5px;color:var(--muted);line-height:1.35}
.level{margin-top:30px}
.level-head{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end;margin-bottom:12px}
.level-num{font:900 64px/0.8 var(--display);color:var(--brass);grid-row:span 2}
.level-head h2{font-size:30px}
.level-head p{font-size:14px;color:var(--muted)}
.mods{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.mod .n{font:700 15px var(--mono);color:var(--muted)}
.mod h3{font-size:21px}
.mod small{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.pill{font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.go{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.install{margin-top:30px;border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--muted);display:grid;gap:6px}
.install b{color:var(--fg)}

/* module */
.modhead{padding-block:18px 6px;display:grid;gap:10px}
.back{border:0;background:none;padding:0;color:var(--muted);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-self:start}
.modhead h1{font-size:clamp(40px,11vw,64px);font-weight:900}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dots button{flex:1;min-width:28px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:700 12px var(--mono);color:var(--muted)}
.dots button.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.dots button.seen{color:var(--fg)}
.section{margin-top:18px;display:grid;gap:16px}
.section > h2{font-size:34px}
.section p{max-width:65ch}
.section p b,.section li b{color:var(--fg);font-weight:800}
.ticks{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ticks li{position:relative;padding-left:22px}
.ticks li::before{content:"";position:absolute;left:2px;top:.62em;width:10px;height:2px;background:var(--brass)}
.tip,.warn{border-radius:14px;padding:14px 16px;display:grid;gap:6px;border:1px solid transparent}
.tip{background:var(--brass-soft)}
.warn{background:var(--bad-soft)}
.warn .lbl{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start}
.card h3{font-size:22px}
.card p{font-size:14.5px;color:var(--muted);line-height:1.5}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.steps li > button{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:34px 1fr 22px;gap:10px;align-items:center;padding:12px 14px;font-weight:700}
.steps li > button::before{content:counter(s);width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font:700 13px var(--mono);border:1px solid var(--line)}
.steps li.done > button::before{content:"✓";background:var(--ok);color:var(--bg);border-color:transparent}
.steps li > button i{font-style:normal;color:var(--muted);transition:transform .2s}
.steps li.open > button i{transform:rotate(45deg)}
.steps li > div{padding:0 14px 14px 58px;color:var(--muted);font-size:15px}
.stepwrap{display:grid;gap:8px}
.stepwrap .bar{height:4px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.stepwrap .bar span{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stepsmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:-2px}
.modnav{display:flex;gap:10px;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}

/* visuals */
.vis{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.vis svg{display:block;width:100%;height:auto;max-width:100%}
.vis .cap{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.info{background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:6px}
.info h3{font-size:24px}
.info p{font-size:15px;color:var(--muted)}
.big-num{font:800 46px/1 var(--mono);color:var(--brass)}
input[type=range]{width:100%;accent-color:var(--brass)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:560px){.split{grid-template-columns:1fr}}
.tl-rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tl-rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;text-align:left;display:grid;gap:2px}
.tl-rail button b{font:700 12px var(--mono);color:var(--muted)}
.tl-rail button span{font-weight:800;font-size:14px}
.tl-rail button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft)}
.tl-rail button[aria-pressed="true"] b{color:var(--brass)}
.tl-year{font:900 52px/0.9 var(--display);color:var(--brass)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tool{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px;text-align:left;display:grid;gap:6px;align-content:start}
.tool svg{width:56px;height:56px;color:var(--brass)}
.tool b{font:800 19px/1 var(--display);text-transform:uppercase}
.tool .more{font-size:13.5px;color:var(--muted);line-height:1.45}
.tool[aria-expanded="true"]{border-color:var(--brass)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.calc input{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:600 16px var(--mono);width:100%}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.result div{background:var(--surface-2);border-radius:12px;padding:12px;display:grid;gap:2px}
.result b{font:800 28px/1.1 var(--mono);color:var(--brass);font-variant-numeric:tabular-nums}
.result span{font-size:12.5px;color:var(--muted)}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.quiz .qn{font:700 13px var(--mono);color:var(--muted)}
.quiz h3{font:800 22px/1.25 var(--body);text-transform:none;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;text-align:left;font-weight:600;display:grid;grid-template-columns:26px 1fr;gap:10px}
.opt::before{content:attr(data-l);font:700 13px var(--mono);color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{font-size:15px;color:var(--muted);border-left:3px solid var(--brass);padding-left:12px}
.score{font:900 80px/0.9 var(--display);color:var(--brass)}
/* prueba de nivel */
.sd-tipo{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sd-tipo button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 14px;text-align:left;display:grid;gap:4px}
.sd-tipo button b{font:800 24px/1 var(--display);text-transform:uppercase}
.sd-tipo button span{font-size:13px;color:var(--muted)}
.sd-tipo button.on{border-color:var(--brass);background:var(--brass-soft)}
.sd-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sd-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sd-acc .btn{justify-content:center}
.sd-ok{background:var(--ok-soft)!important;color:var(--ok)!important;border-color:transparent!important}
.sd-bad{background:var(--bad-soft)!important;color:var(--bad)!important;border-color:transparent!important}
.sd-bars{display:grid;gap:10px}
.sd-bar{display:grid;gap:6px}
.sd-bar .row{justify-content:space-between}
.sd-bar i{display:block;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.sd-bar i span{display:block;height:100%;background:var(--brass);border-radius:99px}
.sd-mods{display:grid;gap:8px}
.sd-mods div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.sd-mods .n{font:700 12px var(--mono);color:var(--muted)}
.sd-miss{display:grid;gap:10px}
.sd-miss div{border-left:3px solid var(--bad);padding-left:12px}
.sd-miss small{color:var(--muted);display:block;margin-top:2px}
.sd-miss a{color:var(--brass);font-weight:700}
.sd-hist{display:grid;gap:8px}
.sd-hist button{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.sd-hist small{color:var(--muted)}
.sd-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
/* prueba práctica */
.pr-serv{display:grid;gap:8px}
.pr-serv button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
.pr-serv button.on{border-color:var(--brass);background:var(--brass-soft)}
.pr-serv small{color:var(--muted)}
.pr-reloj{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5}
.pr-reloj b{font:800 34px/1 var(--mono);color:var(--brass);letter-spacing:.02em}
.pr-crit{display:grid;gap:10px}
.pr-c{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:grid;gap:8px}
.pr-c h4{margin:0;font:800 18px/1.1 var(--display);text-transform:uppercase}
.pr-c p{margin:0;font-size:13.5px;color:var(--muted)}
.pr-pts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pr-pts button{border:1px solid var(--line);border-radius:10px;padding:10px 0;font:800 18px var(--mono);background:var(--surface-2);color:var(--fg)}
.pr-pts button.on{background:var(--brass);color:#141414;border-color:var(--brass)}
.pr-pts button.on.b1,.pr-pts button.on.b2{background:var(--bad);border-color:var(--bad);color:#fff}
.pr-fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr-f{position:relative;aspect-ratio:3/4;max-width:100%;border:1px dashed var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--surface);text-align:center;font-size:12px;color:var(--muted);cursor:pointer}
.pr-f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr-f span{position:absolute;left:0;right:0;bottom:0;padding:4px;background:rgba(0,0,0,.55);color:#fff;font-weight:700}
.pr-f input{display:none}
.pr-notas textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--fg);font:inherit;resize:vertical}
.pr-res .row{justify-content:space-between}
.pr-alum{display:grid;gap:8px}
.pr-alum button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.pr-alum small{color:var(--muted)}
.pr-prog{font:700 14px var(--mono);color:var(--brass)}
.badge{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:10px}

/* glossary */
.search{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;margin-top:18px}
.gloss{display:grid;gap:0;margin-top:12px}
.gloss div{padding:12px 2px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.gloss b{font:800 20px/1.1 var(--display);text-transform:uppercase}
.gloss span{color:var(--muted);font-size:15px}

/* stage (modo clase) */
#stage{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#stage .sh{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#stage .sh .t{flex:1;min-width:0;font:800 18px/1.1 var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage .count{font:700 13px var(--mono);color:var(--muted)}
#stage .body{overflow:auto;padding-block:22px}
#stage .slide{max-width:1000px;margin:0 auto;display:grid;gap:20px;font-size:clamp(17px,2.2vw,22px)}
#stage .slide > h2{font-size:clamp(44px,7vw,88px);font-weight:900}
#stage .slide .card p,#stage .slide .info p{font-size:clamp(15px,1.6vw,18px)}
#stage .sf{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
#stage .sf .pole{flex:1}
.classq h3{font:800 clamp(26px,4vw,44px)/1.2 var(--body)}
.classq .opt{font-size:clamp(16px,2vw,22px)}


.iconbtn.tvbtn.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.tvpanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:60;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.tvpanel p{font-size:14px}
.tvlink{display:grid;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px}
.tvlink code{font:600 12.5px var(--mono);word-break:break-all;user-select:all}
.tvtoast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw;text-align:center}
body.tvmode{cursor:none}
body.tvmode #app,body.tvmode .tabs{display:none!important}
body.tvmode #stage .sh button,body.tvmode #stage .sf button,body.tvmode #stage #rv{display:none!important}
body.tvmode #stage{padding:3vh 4vw}
body.tvmode #stage .slide{font-size:20px;max-width:900px}
body.tvmode #stage .slide > h2{font-size:64px}
body.tvmode #stage .slide .card p,body.tvmode #stage .slide .info p{font-size:18px}
body.tvmode #stage .sh .t{font-size:clamp(18px,2vw,34px)}
body.tvmode #stage .count{font-size:clamp(13px,1.6vw,26px)}
#tvwait{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;background:var(--bg);padding:24px}
#tvwait h1{font:900 clamp(48px,9vw,120px)/.9 var(--display);text-transform:uppercase}
#tvwait h1 em{font-style:normal;color:var(--brass);display:block}
#tvwait p{color:var(--muted);font-size:clamp(16px,2vw,24px)}
#tvwait small{color:var(--muted);opacity:.7}
#tvwait .pole{width:min(420px,70vw)}
@media (prefers-reduced-motion: reduce){.pole,.spin{animation:none!important}*{transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div class="tabs"><nav id="tabs"></nav></div>
<div id="stage" hidden></div>

<script>
/* ============ CONTENIDO ============ */
const LEVELS=[
 {n:1,t:'Fundamentos',d:'Historia, herramientas, higiene y la cabeza que vas a cortar.'},
 {n:2,t:'Diagnóstico',d:'Leer el rostro, el cabello y al cliente antes de tocar la máquina.'},
 {n:3,t:'Técnica',d:'Ángulos, degradados y acabados limpios.'},
 {n:4,t:'Maestría y negocio',d:'Barba, navaja, diseños y cómo vivir del oficio.'}
];

const MODULES=[
{id:'historia',lv:1,t:'Historia de la barbería',s:'De las navajas de bronce a la barbería premium.',min:15,sec:[
 {h:'De dónde venimos',b:[
  {t:'p',x:'La barbería es uno de los oficios más antiguos del mundo. Antes de ser estilo, fue <b>higiene, estatus y medicina</b>. Conocer esta historia te da algo que muchos barberos no tienen: orgullo de oficio y conversación con el cliente.'},
  {t:'vis',v:'timeline'},
  {t:'tip',x:'Contale al cliente una historia corta mientras trabajás (el poste, los barberos-cirujanos). La gente recuerda al barbero que le enseñó algo.'}]},
 {h:'El poste de barbero',b:[
  {t:'p',x:'Durante siglos los barberos también eran <b>barberos-cirujanos</b>: sacaban muelas, curaban heridas y hacían sangrías. El poste nació de ese pasado. Tocá cada color.'},
  {t:'vis',v:'pole'}]},
 {h:'La barbería moderna',b:[
  {t:'p',x:'Entre 1920 y 1950 la barbería fue el club social de los hombres. Con el pelo largo de los 60 y 70 y los salones unisex, muchas cerraron. En los 90 y 2000 las barberías afroamericanas y latinas de Estados Unidos crearon la técnica moderna del <b>degradado, el perfilado y los diseños</b>.'},
  {t:'p',x:'Hoy vivimos un renacimiento: barberías premium, redes sociales, barberos como marca personal y academias. Lo que antes era un servicio rápido ahora es una <b>experiencia</b>.'},
  {t:'cards',x:[{h:'Antes',d:'Servicio rápido, precio bajo, el cliente iba a la más cercana.'},{h:'Ahora',d:'Experiencia, marca, cita agendada. El cliente sigue al barbero, no al local.'},{h:'Tu ventaja',d:'Técnica + trato + imagen. Las tres juntas son las que cobran más.'}]}]}
],q:[
 {q:'¿Por qué el poste de barbero tiene rojo y blanco?',o:['Por la bandera de Inglaterra','Por los barberos-cirujanos: sangre y vendas','Porque eran los colores más baratos','Por un equipo de fútbol'],a:1,e:'Los barberos-cirujanos hacían sangrías; el rojo se asocia a la sangre y el blanco a las vendas.'},
 {q:'¿Qué tenían en común los barberos de Grecia y Roma?',o:['Sólo atendían mujeres','La barbería era punto de reunión social','No usaban navaja','Trabajaban sólo de noche'],a:1,e:'En el ágora griega y en Roma la barbería era lugar de noticias y conversación.'},
 {q:'¿Quiénes definieron en gran parte la técnica moderna del degradado?',o:['Los peluqueros de París del siglo XVIII','Las barberías afroamericanas y latinas de EE.UU.','Los barberos romanos','Las fábricas de máquinas'],a:1,e:'En los 90 y 2000 esas barberías desarrollaron fades, perfilados y diseños.'},
 {q:'¿Qué vende de verdad una barbería premium hoy?',o:['El corte más barato','La experiencia completa: técnica, trato e imagen','Sólo productos','Rapidez'],a:1,e:'El cliente premium paga por la experiencia y la confianza, no sólo por el corte.'}]},

{id:'herramientas',lv:1,t:'Herramientas',s:'Tu kit, los peines guía y cómo cuidarlo.',min:18,sec:[
 {h:'Tu kit de trabajo',b:[
  {t:'p',x:'Cada herramienta tiene un trabajo. Tocá cada una para ver para qué sirve y un consejo de uso.'},
  {t:'vis',v:'tools'}]},
 {h:'Peines guía y medidas',b:[
  {t:'p',x:'Los números de los peines indican el largo que queda. Mové el control para ver la diferencia real en milímetros.'},
  {t:'vis',v:'guards'},
  {t:'tip',x:'La palanca de la máquina también cambia el largo. Abierta corta un poco más largo y cerrada más corto: es como tener <b>medio número extra</b> entre peine y peine. Ahí está el secreto del difuminado.'}]},
 {h:'Mantenimiento',b:[
  {t:'p',x:'Una máquina mal cuidada jala el pelo, se calienta y lastima al cliente. Tocá cada paso cuando lo hagás.'},
  {t:'steps',x:[
   {h:'Quitar el pelo',d:'Con el cepillo de cerdas limpiá las cuchillas después de cada cliente.'},
   {h:'Desinfectar',d:'Spray desinfectante para cuchillas, respetando el tiempo de contacto que indica el producto.'},
   {h:'Aceitar',d:'Tres gotas: una al centro y una en cada extremo de la cuchilla. Encendé la máquina unos segundos y secá el exceso.'},
   {h:'Revisar el ajuste',d:'La cuchilla móvil nunca debe pasar a la fija. Revisá con luz antes de usarla en piel.'},
   {h:'Navaja nueva',d:'Hoja desechable nueva por cliente, abierta frente a él.'},
   {h:'Cargar',d:'Máquinas inalámbricas cargadas al final del día para no quedarte a media cita.'}]},
  {t:'warn',x:'El ajuste en cero (zero gap) deja la cuchilla muy cerca de la piel. Si la cuchilla móvil sobresale, corta. Sólo hacelo si ya sabés y revisá siempre.'}]}
],q:[
 {q:'¿Cuántos milímetros deja aproximadamente el peine #2?',o:['3 mm','6 mm','10 mm','13 mm'],a:1,e:'#1 ≈ 3 mm, #2 ≈ 6 mm, #3 ≈ 10 mm, #4 ≈ 13 mm.'},
 {q:'¿Para qué sirve la trimmer (detallista)?',o:['Cortar todo el volumen','Contornos, líneas y detalles','Secar el pelo','Afeitar la barba con espuma'],a:1,e:'La trimmer tiene cuchilla fina para perfilar, líneas y diseños.'},
 {q:'¿Dónde van las gotas de aceite?',o:['En el motor','Centro y extremos de la cuchilla','En el peine guía','En el cable'],a:1,e:'Una gota al centro y una en cada extremo, luego enciendes para que se distribuya.'},
 {q:'¿Qué pasa al cerrar la palanca de la máquina?',o:['Corta más largo','Corta más corto','La apaga','No cambia nada'],a:1,e:'Cerrada corta más corto; abierta, más largo. Sirve para difuminar entre números.'}]},

{id:'higiene',lv:1,t:'Higiene y bioseguridad',s:'Lo que protege a tu cliente y a tu nombre.',min:12,sec:[
 {h:'Por qué importa',b:[
  {t:'p',x:'Una herramienta sucia puede pasar hongos, bacterias e infecciones de un cliente a otro. La higiene no se nota cuando está bien hecha, pero <b>se nota muchísimo cuando falta</b>. Es uno de los valores de Meraki.'},
  {t:'cards',x:[{h:'Foliculitis',d:'Infección del folículo: granitos rojos después del corte o afeitado. Común con navajas o máquinas sucias.'},{h:'Tiña',d:'Hongo del cuero cabelludo. Se ven parches con descamación. No se corta: se refiere al médico.'},{h:'Sangre',d:'Un corte con navaja expone sangre. Por eso la hoja es desechable y personal.'}]}]},
 {h:'Protocolo entre clientes',b:[
  {t:'steps',x:[
   {h:'Lavarte las manos',d:'Antes de cada cliente, frente a él si podés. Genera confianza.'},
   {h:'Capa limpia y cuello de papel',d:'El cuello de papel evita que la capa toque la piel.'},
   {h:'Limpiar herramientas',d:'Quitar todo el pelo de peines, máquinas y tijeras.'},
   {h:'Desinfectar',d:'Peines y accesorios en solución desinfectante o spray, con el tiempo que indique la etiqueta.'},
   {h:'Hoja nueva',d:'Navaja desechable nueva para cada cliente.'},
   {h:'Superficies',d:'Silla, apoyacabezas y mesa limpios.'}]}]},
 {h:'Limpiar, desinfectar, esterilizar',b:[
  {t:'cards',x:[{h:'Limpiar',d:'Quitar pelo y suciedad visible. Siempre va primero: sobre suciedad el desinfectante no funciona bien.'},{h:'Desinfectar',d:'Eliminar la mayoría de microbios con un producto químico. Lo normal entre clientes.'},{h:'Esterilizar',d:'Eliminar todo microorganismo (autoclave). Para instrumentos metálicos que lo permitan.'}]},
  {t:'warn',x:'Nunca reutilices una hoja de navaja, ni "sólo para este cliente que es conocido".'}]}
],q:[
 {q:'¿Qué va primero?',o:['Desinfectar','Limpiar','Esterilizar','Aceitar'],a:1,e:'Siempre limpiás primero; el desinfectante no trabaja bien sobre pelo y suciedad.'},
 {q:'Un cliente tiene parches con descamación en el cuero cabelludo. ¿Qué hacés?',o:['Corto normal','Corto y le echo alcohol','No corto y le recomiendo ir al médico','Le corto sólo arriba'],a:2,e:'Podría ser tiña u otra infección. No trabajás sobre eso y lo referís.'},
 {q:'¿Para qué sirve el cuello de papel?',o:['Decoración','Que la capa no toque la piel','Absorber el aceite','Medir el cuello'],a:1,e:'Es una barrera higiénica entre la capa y la piel del cliente.'},
 {q:'¿Cada cuánto cambiás la hoja de navaja?',o:['Cada semana','Cada día','Por cada cliente','Cuando ya no corta'],a:2,e:'Una hoja nueva por cliente, siempre.'}]},

{id:'anatomia',lv:1,t:'Anatomía de la cabeza',s:'Zonas y puntos de referencia para cortar con método.',min:15,sec:[
 {h:'Zonas de la cabeza',b:[
  {t:'p',x:'Un barbero profesional no corta "por encima": divide la cabeza en zonas. Tocá cada zona del dibujo.'},
  {t:'vis',v:'head'}]},
 {h:'Puntos de referencia',b:[
  {t:'cards',x:[
   {h:'Línea parietal',d:'La parte más ancha de la cabeza, donde el lado se convierte en la parte de arriba. Ahí suele terminar un fade alto y es donde más se nota el peso.'},
   {h:'Hueso occipital',d:'El bulto de atrás. Si es plano, dejá más largo ahí para dar forma redonda.'},
   {h:'Coronilla',d:'Donde suele estar el remolino. Si cortás muy corto ahí, el pelo se para.'},
   {h:'Esquinas frontales',d:'Donde la frente se convierte en lado. Definen el contorno y las entradas.'},
   {h:'Línea de nacimiento',d:'El borde natural del pelo: frente, patillas, alrededor de la oreja y nuca.'}]}]},
 {h:'Ninguna cabeza es igual',b:[
  {t:'p',x:'Hay cabezas planas atrás, con bultos, con la coronilla alta o con una oreja más arriba que la otra. Tu trabajo es <b>equilibrar</b>: dejar peso donde falta forma y quitar donde sobra. Pasá la mano por la cabeza del cliente antes de empezar.'},
  {t:'tip',x:'Para revisar simetría, parate detrás del cliente y miralo en el espejo de frente. Los errores de lado a lado se ven más en el reflejo.'}]}
],q:[
 {q:'¿Qué es la línea parietal?',o:['La nuca','La parte más ancha de la cabeza','La línea de la frente','La patilla'],a:1,e:'Es la zona más ancha, donde el lado cambia a la parte superior.'},
 {q:'Cliente con la parte de atrás plana. ¿Qué hacés en el occipital?',o:['Rapar más','Dejar más peso para dar forma','Nada','Hacer un diseño'],a:1,e:'Dejar más largo crea la ilusión de una cabeza redonda.'},
 {q:'¿Dónde suele estar el remolino?',o:['En la patilla','En la coronilla','En la nuca siempre','En la frente siempre'],a:1,e:'La coronilla es el lugar más común, aunque puede haber en la frente o la nuca.'},
 {q:'¿Por qué revisar en el espejo de frente?',o:['Para que el cliente te vea','Las diferencias de lado a lado se notan más','Para tomar fotos','No sirve'],a:1,e:'El reflejo te muestra ambos lados a la vez y se notan las asimetrías.'}]},

{id:'rostro',lv:2,t:'Rostro y estilo',s:'Qué corte favorece a cada forma de cara.',min:15,sec:[
 {h:'Cómo medir',b:[
  {t:'p',x:'Mirá al cliente de frente, con el pelo hacia atrás. Compará cuatro medidas:'},
  {t:'list',x:['<b>Frente:</b> lo ancho de la frente','<b>Pómulos:</b> la parte más ancha de la cara','<b>Mandíbula:</b> de esquina a esquina de la quijada','<b>Largo:</b> del nacimiento del pelo a la barbilla']}]},
 {h:'Tipos de rostro',b:[
  {t:'p',x:'Elegí una forma para ver qué le favorece y qué evitar.'},
  {t:'vis',v:'faces'}]},
 {h:'La regla de oro',b:[
  {t:'p',x:'La mayoría de cortes buscan acercar la cara a un <b>óvalo</b>: si la cara es ancha, sumás altura; si es larga, quitás altura y das volumen a los lados.'},
  {t:'tip',x:'La barba también es una herramienta de forma. Una barba más larga en la barbilla alarga una cara redonda; una barba cuadrada da mandíbula a una cara fina.'}]}
],q:[
 {q:'Cara redonda. ¿Qué buscás?',o:['Más volumen a los lados','Altura arriba y lados cortos','Fleco recto','Pelo pegado'],a:1,e:'La altura alarga visualmente una cara redonda.'},
 {q:'¿Qué forma se considera la más fácil de adaptar?',o:['Ovalada','Cuadrada','Diamante','Corazón'],a:0,e:'El óvalo tiene proporciones equilibradas; casi todo le queda.'},
 {q:'Cara alargada. ¿Qué evitás?',o:['Lados con algo de volumen','Mucha altura arriba','Fleco','Barba corta'],a:1,e:'Más altura la haría ver más larga.'},
 {q:'Cara de corazón (frente ancha, barbilla fina). ¿Qué ayuda?',o:['Barba que dé volumen a la barbilla','Rapar los lados a piel y mucha altura','Nada','Pelo largo pegado'],a:0,e:'La barba en la parte baja equilibra la frente ancha.'}]},

{id:'cabello',lv:2,t:'Cabello y cuero cabelludo',s:'Textura, densidad, remolinos y cuándo no cortar.',min:12,sec:[
 {h:'Textura',b:[
  {t:'cards',x:[
   {h:'Liso',d:'Cae pegado y muestra todas las líneas. Los errores se ven más; difuminá con paciencia.'},
   {h:'Ondulado',d:'Tiene movimiento. Ideal para texturizar arriba. Cortá un poco más largo de lo que pide.'},
   {h:'Rizado',d:'Se encoge al secar. Cortá en seco o calculá que sube varios centímetros.'},
   {h:'Crespo o afro',d:'Muy denso y elástico. Perfecto para fades y diseños; peiná con peine de púas anchas o esponja.'}]}]},
 {h:'Densidad y grosor',b:[
  {t:'p',x:'<b>Densidad</b> es cuántos pelos hay por centímetro. <b>Grosor</b> es qué tan grueso es cada pelo. Pelo denso y grueso necesita entresacar; pelo fino y poco denso necesita conservar peso para que no se vea el cuero cabelludo.'},
  {t:'tip',x:'Pelo fino con entradas: no lo cortes demasiado corto arriba. Un poco de largo y textura disimula más que raparlo.'}]},
 {h:'Dirección y remolinos',b:[
  {t:'p',x:'El pelo no crece todo hacia abajo. Antes de cortar, peiná en seco en varias direcciones y buscá remolinos en la coronilla, la frente y la nuca. Cortá <b>a favor</b> del remolino o dejalo con largo suficiente para que caiga.'}]},
 {h:'Cuándo no cortar',b:[
  {t:'warn',x:'Heridas abiertas, infecciones, piojos o hongos: no trabajás. Explicale al cliente con respeto y recomendale ir al médico. Proteger al siguiente cliente también es parte del servicio.'}]}
],q:[
 {q:'El pelo rizado al secarse…',o:['Se alarga','Se encoge','No cambia','Se alisa'],a:1,e:'El rizo se recoge; cortá considerando que sube.'},
 {q:'¿Qué es la densidad?',o:['El grosor de cada pelo','Cuántos pelos hay por área','El color','La velocidad de crecimiento'],a:1,e:'Densidad = cantidad; grosor = diámetro de cada pelo.'},
 {q:'Remolino en la coronilla y el cliente quiere arriba muy corto. Riesgo:',o:['Ninguno','Que el pelo se pare','Que se caiga el pelo','Que cambie de color'],a:1,e:'Muy corto sobre un remolino, el pelo se levanta.'},
 {q:'Ves piojos al empezar. ¿Qué hacés?',o:['Corto rápido','No trabajo y lo explico con respeto','Le pongo alcohol','Corto sólo los lados'],a:1,e:'No trabajás para proteger a otros clientes y explicás con tacto.'}]},

{id:'consulta',lv:2,t:'Consulta con el cliente',s:'Escuchar bien es la mitad del corte.',min:10,sec:[
 {h:'Los primeros tres minutos',b:[
  {t:'steps',x:[
   {h:'Saludo y nombre',d:'Por su nombre, con contacto visual. Puntualidad: si la cita es a las 3, a las 3.'},
   {h:'Qué quiere',d:'Preguntá y pedí foto de referencia. Una foto evita la mitad de los malentendidos.'},
   {h:'Su estilo de vida',d:'¿A qué se dedica? ¿Se peina todos los días? ¿Cada cuánto viene?'},
   {h:'Mirar en seco',d:'Remolinos, densidad, forma de la cabeza, entradas.'},
   {h:'Ser honesto',d:'Si la foto no le va a funcionar con su pelo, decilo y proponé una opción cercana.'},
   {h:'Confirmar con números',d:'"Abajo en cero, un fade medio, arriba dejamos 5 centímetros." Que diga sí antes de empezar.'}]}]},
 {h:'Hablar el mismo idioma',b:[
  {t:'cards',x:[
   {h:'"Bajito"',d:'Para uno es #1, para otro es #3. Siempre traducí a números o mostrá el peine.'},
   {h:'"Sólo las puntas"',d:'Preguntá cuántos centímetros, y mostralo con los dedos.'},
   {h:'"Como la vez pasada"',d:'Llevá registro: anotá en su ficha los números que usaste.'}]},
  {t:'tip',x:'Los valores Meraki se viven en la consulta: honestidad, puntualidad, higiene, excelencia y respeto.'}]},
 {h:'El cierre',b:[
  {t:'list',x:['Mostrá la parte de atrás con el espejo de mano','Explicale cómo peinarse en casa y con qué producto','Agendá la próxima cita (2 a 3 semanas para fades)','Pedile que te etiquete si sube foto']}]}
],q:[
 {q:'El cliente dice "bajito a los lados". ¿Qué hacés?',o:['Uso #1 sin preguntar','Confirmo con números o mostrando el peine','Rapo a piel','Uso #4'],a:1,e:'"Bajito" significa cosas distintas para cada persona.'},
 {q:'La foto no le va a funcionar con su tipo de pelo. ¿Qué hacés?',o:['Lo hago igual','Le digo con honestidad y propongo algo cercano','Le cobro más','Lo mando a otra barbería'],a:1,e:'La honestidad genera confianza y clientes fijos.'},
 {q:'¿Cada cuánto recomendás volver con un fade?',o:['2 a 3 semanas','6 meses','1 año','Cada día'],a:0,e:'El fade pierde definición rápido; 2 a 3 semanas lo mantiene limpio.'},
 {q:'¿Para qué anotar los números que usaste?',o:['No sirve','Para repetir el corte igual la próxima vez','Para cobrar más','Para la policía'],a:1,e:'La consistencia es lo que hace que el cliente regrese.'}]},

{id:'tecnicas',lv:3,t:'Técnicas base',s:'Ángulos de elevación, tijera y máquina sobre peine.',min:20,sec:[
 {h:'Ángulos de elevación',b:[
  {t:'p',x:'La elevación es a qué ángulo levantás el pelo de la cabeza antes de cortarlo. Cambia por completo el resultado. Mové el control.'},
  {t:'vis',v:'elevation'}]},
 {h:'Tijera sobre peine',b:[
  {t:'steps',x:[
   {h:'Peine en la mano izquierda',d:'Entrá con el peine desde abajo, con los dientes hacia arriba, levantando el pelo.'},
   {h:'Ángulo del peine',d:'El ángulo del peine contra la cabeza define el largo: más pegado, más corto.'},

/* ============ QUIZ ============ */
function quiz(el,qs,onEnd){
 let i=0,ok=0;
 const L='ABCD';
 const q=()=>{const Q=qs[i];
  el.innerHTML=`<div class="quiz"><div class="row" style="justify-content:space-between"><span class="qn">Pregunta ${i+1} / ${qs.length}</span><span class="qn">${ok} correctas</span></div><h3>${Q.q}</h3><div class="opts">${Q.o.map((o,k)=>`<button type="button" class="opt" data-l="${L[k]}" data-k="${k}">${o}</button>`).join('')}</div><div id="qx"></div></div>`;
  $$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$$('.opt',el).forEach(x=>{x.disabled=true;if(+x.dataset.k===Q.a)x.classList.add('right')});if(k===Q.a)ok++;else b.classList.add('wrong');
   $('#qx',el).innerHTML=`<p class="expl"><b style="color:${k===Q.a?'var(--ok)':'var(--bad)'}">${k===Q.a?'¡Correcto!':'No exactamente.'}</b> ${Q.e}</p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" type="button" id="qn">${i<qs.length-1?'Siguiente':'Ver resultado'}</button></div>`;
   $('#qn',el).onclick=()=>{i++;i<qs.length?q():end()};$('#qn',el).focus()});};
 const end=()=>{const pc=Math.round(ok/qs.length*100);onEnd&&onEnd(pc);
  el.innerHTML=`<div class="quiz badge"><span class="lbl">Resultado</span><div class="score">${pc}%</div><p>${ok} de ${qs.length} correctas. ${pc>=70?'Módulo aprobado. Así se trabaja.':'Te falta poco. Repasá y volvé a intentar: necesitás 70%.'}</p><div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="qr">Repetir</button>${pc>=70?'<button class="btn" type="button" id="qh">Volver al inicio</button>':''}</div></div>`;
  $('#qr',el).onclick=()=>{i=0;ok=0;q()};const h=$('#qh',el);if(h)h.onclick=()=>go('home');};
 q();
}

/* ============ PRUEBA DE NIVEL (el instructor pregunta, el alumno contesta) ============ */
let SD={fase:'inicio',tipo:'completa',nombre:''};
function sdPreguntas(tipo){const r=[];MODULES.forEach(m=>{const qs=SONDEO.filter(x=>x.m===m.id);(tipo==='rapida'?qs.slice(0,1):qs).forEach(q=>r.push(q))});return r}
function sdCalcular(res){
 const porMod=MODULES.map(m=>{const r=res.filter(x=>x.m===m.id);return {id:m.id,ok:r.filter(x=>x.ok).length,tot:r.length}}).filter(x=>x.tot);
 const porNivel=LEVELS.map(L=>{const r=res.filter(x=>modById(x.m).lv===L.n);return {n:L.n,t:L.t,ok:r.filter(x=>x.ok).length,tot:r.length}});
 let nivel=0;for(const x of porNivel){if(x.tot&&x.ok/x.tot>=0.7)nivel=x.n;else break}
 const ok=res.filter(x=>x.ok).length,pc=res.length?Math.round(ok/res.length*100):0;
 const inicio=porMod.find(x=>x.ok<x.tot);
 return {porMod,porNivel,nivel,ok,tot:res.length,pc,inicio:inicio?inicio.id:null};
}
function sdTexto(r){const c=sdCalcular(r.res),f=new Date(r.fecha);

 const rep=c.porMod.filter(x=>x.ok<x.tot).map(x=>modById(x.id).t);
 if(rep.length)L.push('',`Reforzar: ${rep.join(', ')}`);
 if(c.inicio)L.push(`Empezar en: Módulo ${pad(MODULES.indexOf(modById(c.inicio))+1)} · ${modById(c.inicio).t}`);
 return L.join('\n')}

   $$('.sd-tipo button',el).forEach(b=>b.onclick=()=>{SD.tipo=b.dataset.t;SD.nombre=$('#sdn',el).value;pinta()});
   $('#sdgo',el).onclick=()=>{SD.nombre=$('#sdn',el).value.trim();SD.qs=sdPreguntas(SD.tipo);SD.i=0;SD.res=[];SD.marcada=null;SD.fase='pregunta';pinta();window.scrollTo({top:0})};

   return}

let ST={m:null,i:0,slides:[]};
function openStage(id){const m=modById(id);ST={m,i:0,acts:[],slides:[{cover:1},...m.sec.map(s=>({s})),...m.q.map(q=>({q}))]};$('#stage').hidden=false;document.body.style.overflow='hidden';drawStage()}
function closeStage(){if(TVL.on&&!TVL.esTele)tvEnviar({on:false});$('#stage').hidden=true;document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function drawStage(){const st=$('#stage'),sl=ST.slides[ST.i],m=ST.m,i=MODULES.indexOf(m)+1;let body='';
 if(sl.cover)body=`<div class="slide" style="align-content:center;min-height:60vh"><div class="pole"></div><span class="lbl">Meraki Academy · Módulo ${pad(i)}</span><h2>${m.t}</h2><p class="muted" style="font-size:clamp(18px,2.4vw,26px)">${m.s}</p></div>`;
 else if(sl.s)body=`<div class="slide"><span class="lbl">Módulo ${pad(i)} · ${m.t}</span><h2>${sl.s.h}</h2>${blocks(sl.s.b)}</div>`;
 else{const q=sl.q;body=`<div class="slide classq"><span class="lbl">Pregunta para la clase</span><h3>${q.q}</h3><div class="opts">${q.o.map((o,k)=>`<div class="opt" data-l="${'ABCD'[k]}" data-k="${k}">${o}</div>`).join('')}</div><div class="row"><button class="btn" id="rv" type="button">Revelar respuesta</button></div><p class="expl" id="rx" hidden>${q.e}</p></div>`}
 st.innerHTML=`<div class="sh"><span class="t">${m.t}</span><span class="count">${ST.i+1} / ${ST.slides.length}</span><button class="iconbtn tvbtn ${TVL.on?'on':''}" id="tvb" type="button" aria-label="Mostrar en la tele">${IC.tele}</button><button class="iconbtn" id="fs" type="button" aria-label="Pantalla completa">${IC.full}</button><button class="iconbtn" id="cx" type="button" aria-label="Cerrar">${IC.x}</button></div><div class="body">${body}</div><div class="sf"><button class="btn ghost" id="pv" type="button" ${ST.i===0?'disabled':''}>←</button><div class="pole" style="opacity:.8"></div><button class="btn" id="nx" type="button">${ST.i===ST.slides.length-1?'Terminar':'→'}</button></div>`;
 mount(st);
 $('#cx',st).onclick=closeStage;$('#pv',st).onclick=()=>step(-1);$('#nx',st).onclick=()=>ST.i===ST.slides.length-1?closeStage():step(1);
 $('#fs',st).onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():st.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
 const rv=$('#rv',st);if(rv)rv.onclick=()=>{$$('.opt',st).forEach(o=>{if(+o.dataset.k===sl.q.a)o.classList.add('right')});$('#rx',st).hidden=false;rv.hidden=true;ST.rev=true;tvPublicar()};
 if(ST.rev&&rv)rv.onclick();
 $('#tvb',st).onclick=tvPanel;
 tvPublicar();
}
function step(d){const n=ST.i+d;if(n<0||n>=ST.slides.length)return;ST.i=n;ST.rev=false;ST.acts=[];drawStage();$('#stage .body').scrollTop=0}
document.addEventListener('keydown',e=>{if($('#stage').hidden)return;if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();step(1)}else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')closeStage()});
let tx=null,ty=null;
$('#stage').addEventListener('touchstart',e=>{if(e.target.closest('input,.vis'))return tx=null;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);tx=null},{passive:true});

function aviso(m){const t=document.createElement('div');t.className='tvtoast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function tvFirebase(){
  if(TVL.fb)return TVL.fb;
  const [{firebaseConfig,ADMIN_EMAIL},A,AU,F]=await Promise.all([import('../config.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
  const app=A.initializeApp(firebaseConfig,'academy');
  TVL.fb={app,db:TVL.esTele?F.initializeFirestore(app,{experimentalForceLongPolling:true}):F.getFirestore(app),F,AU,auth:AU.getAuth(app),admin:ADMIN_EMAIL};
  return TVL.fb;
}
function tvEnviar(extra){const f=TVL.fb;if(!f)return;f.F.setDoc(f.F.doc(f.db,'proyector','academia'),Object.assign({on:true,mod:ST.m&&ST.m.id,i:ST.i,rev:!!ST.rev,acts:JSON.stringify(ST.acts||[]),ts:Date.now()},extra||{})).catch(e=>aviso('No se pudo enviar a la tele: '+(e.code||e.message)))}
function tvPublicar(){if(TVL.on&&!TVL.esTele&&ST.m)tvEnviar()}
async function tvConectar(){
  try{
    const f=await tvFirebase();
    const esAdmin=u=>u&&u.emailVerified&&String(u.email||'').toLowerCase()===String(f.admin).toLowerCase();
    let u=f.auth.currentUser;
    if(!u){await new Promise(r=>{const off=f.AU.onAuthStateChanged(f.auth,x=>{off();r()})});u=f.auth.currentUser}
    if(!esAdmin(u)){const p=new f.AU.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});const r=await f.AU.signInWithPopup(f.auth,p);u=r.user}
    if(!esAdmin(u)){aviso('Sólo el instructor puede transmitir a la tele.');await f.AU.signOut(f.auth);return false}
    TVL.on=true;try{localStorage.setItem('meraki_tv_on','1')}catch(e){}tvPublicar();return true;
  }catch(e){aviso((e.code||'').includes('popup-closed')?'Cancelaste el inicio de sesión.':'No se pudo conectar: '+(e.code||e.message));return false}
}
function tvPanel(){
  const st=$('#stage');let pn=$('#tvpanel',st);if(pn){pn.remove();return}
  pn=document.createElement('div');pn.id='tvpanel';pn.className='tvpanel';
  const pint=()=>{pn.innerHTML=TVL.on?`<b>📺 Transmitiendo a la tele</b><p class="muted">En la tele abrí este link. Lo que pasés aquí aparece allá.</p><div class="tvlink"><code>${tvURL}</code><button class="btn sm" type="button" id="tvcopy">Copiar</button></div><button class="btn ghost sm" type="button" id="tvoff">Dejar de transmitir</button>`:`<b>Mostrar la clase en la tele</b><p class="muted">Tu cel queda como control y la tele muestra las láminas. Entrás una vez con tu Gmail de instructor.</p><button class="btn sm" type="button" id="tvon">Conectar con la tele</button>`;
    const on=$('#tvon',pn);if(on)on.onclick=async()=>{on.disabled=true;on.textContent='Conectando…';if(await tvConectar()){pint();($('#tvb',st)||{classList:{add(){}}}).classList.add('on')}else{on.disabled=false;on.textContent='Conectar con la tele'}};
    const off=$('#tvoff',pn);if(off)off.onclick=()=>{tvEnviar({on:false});TVL.on=false;try{localStorage.removeItem('meraki_tv_on')}catch(e){}pint();($('#tvb',st)||{classList:{remove(){}}}).classList.remove('on')};
    const cp=$('#tvcopy',pn);if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(tvURL);aviso('Link copiado.')}catch(e){const r=document.createRange();r.selectNodeContents(pn.querySelector('code'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);aviso('Mantené presionado para copiar.')}};
  };
  pint();st.appendChild(pn);
}
// Modo tele: esta pantalla sólo muestra lo que manda el instructor
async function modoTeleAcademy(){
  document.body.classList.add('tvmode');document.documentElement.dataset.theme='dark';
  const esp=document.createElement('div');esp.id='tvwait';esp.innerHTML='<div class="pole"></div><h1>Meraki <em>Academy</em></h1><p>Esperando la clase…</p><small>Tocá la pantalla para ponerla completa</small>';document.body.appendChild(esp);
  document.addEventListener('click',()=>{try{if(!document.fullscreenElement){const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}});
  const lock=async()=>{try{if('wakeLock' in navigator&&document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}};lock();document.addEventListener('visibilitychange',lock);
  try{
    const f=await tvFirebase();let ult=0,hechos=0;
    f.F.onSnapshot(f.F.doc(f.db,'proyector','academia'),d=>{
      const x=d.exists()?d.data():null;if(!x||(x.ts||0)<ult)return;ult=x.ts||0;
      if(!x.on||!modById(x.mod)){$('#stage').hidden=true;esp.hidden=false;return}
      esp.hidden=true;let acts=[];try{acts=JSON.parse(x.acts||'[]')}catch(e){}
      const mismo=ST.m&&ST.m.id===x.mod&&ST.i===(x.i||0)&&ST.rev===!!x.rev&&!$('#stage').hidden&&acts.length>=hechos&&JSON.stringify(acts.slice(0,hechos-1))===JSON.stringify(ST.acts.slice(0,hechos-1));
      if(!mismo){
        if(!ST.m||ST.m.id!==x.mod){openStage(x.mod)}
        ST.i=Math.max(0,Math.min(x.i||0,ST.slides.length-1));ST.rev=!!x.rev;$('#stage').hidden=false;drawStage();$('#stage .body').scrollTop=0;hechos=0;ST.acts=[];
      }else if(hechos>0&&acts[hechos-1]&&acts[hechos-1].t==='i'){hechos--}
      for(let k=hechos;k<acts.length;k++)tvRepetir(acts[k]);
      hechos=acts.length;ST.acts=acts;
      requestAnimationFrame(()=>setTimeout(ajustarTele,60));
    },e=>{esp.querySelector('p').textContent=(e.code||'').includes('permission')?'Falta el permiso de lectura en Firebase.':'Sin conexión. Reintentando…'});
  }catch(e){esp.querySelector('p').textContent='No se pudo conectar: '+e.message}
}
// Lo que el instructor toca en las láminas (línea del tiempo, botones, deslizadores) se repite en la tele
function tvRuta(el,root){const p=[];while(el&&el!==root){const pa=el.parentNode;if(!pa)return null;p.unshift(Array.prototype.indexOf.call(pa.children,el));el=pa}return el===root?p:null}
function tvBuscar(p){let el=$('#stage .slide');for(let k=0;el&&k<p.length;k++)el=el.children[p[k]];return el}
function tvRepetir(a){try{const el=tvBuscar(a.p||[]);if(!el)return;if(a.t==='i'){el.value=a.v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}else{el.click()}}catch(e){}}
let tvT=null;
function tvGrabar(a){if(!TVL.on||TVL.esTele||!ST.m)return;ST.acts=ST.acts||[];const u=ST.acts[ST.acts.length-1];
  if(a.t==='i'&&u&&u.t==='i'&&JSON.stringify(u.p)===JSON.stringify(a.p))ST.acts[ST.acts.length-1]=a;else ST.acts.push(a);
  clearTimeout(tvT);tvT=setTimeout(()=>tvEnviar(),a.t==='i'?150:0)}
$('#stage').addEventListener('click',e=>{if(TVL.esTele||!e.isTrusted)return;const sl=$('#stage .slide');if(!sl||!sl.contains(e.target)||e.target.closest('#rv'))return;const p=tvRuta(e.target,sl);if(p)tvGrabar({t:'c',p})},true);
$('#stage').addEventListener('input',e=>{if(TVL.esTele)return;const sl=$('#stage .slide');if(!sl||!sl.contains(e.target))return;const p=tvRuta(e.target,sl);if(p)tvGrabar({t:'i',p,v:e.target.value})},true);
// Si ya estabas transmitiendo, al volver a abrir la app se reconecta solo
(function(){let ok=false;try{ok=localStorage.getItem('meraki_tv_on')==='1'}catch(e){}if(!ok||TVL.esTele)return;
  tvFirebase().then(f=>{const off=f.AU.onAuthStateChanged(f.auth,u=>{off();if(u&&u.emailVerified&&String(u.email||'').toLowerCase()===String(f.admin).toLowerCase()){TVL.on=true;const b=$('#tvb');if(b)b.classList.add('on');tvPublicar()}})}).catch(()=>{})})();
// En la tele no se puede deslizar: si la lámina es más alta que la pantalla, se reduce hasta que quepa completa
function ajustarTele(){const b=$('#stage .body'),sl=$('#stage .slide');if(!b||!sl)return;sl.style.zoom=1;const dh=b.clientHeight-8,dw=b.clientWidth-8,alto=sl.scrollHeight,ancho=sl.offsetWidth||1;let z=Math.min(dh/alto,dw/ancho)*.96;z=Math.max(.45,Math.min(z,2.6));sl.style.zoom=z.toFixed(3)}
if(TVL.esTele){modoTeleAcademy();let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(ajustarTele,150)})}

 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const o=e.target.closest('[data-open]');if(o){go('module',o.dataset.open,0);return}
 const s=e.target.closest('[data-sec]');if(s&&S.view==='module'&&!s.closest('#stage')){const v=+s.dataset.sec;if(v>=0)go('module',S.mod,v);return}
 const st=e.target.closest('[data-stage]');if(st){openStage(st.dataset.stage);return}
 if(e.target.closest('#th')){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(KEY+'-theme',r.dataset.theme)}catch(e){}}
});
try{const t=localStorage.getItem(KEY+'-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
